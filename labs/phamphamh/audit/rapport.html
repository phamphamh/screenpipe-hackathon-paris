* { box-sizing: border-box; }
html, body { height: 100%; }

.cadre { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; max-width: 1320px; margin: 0 auto; padding-block: 18px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.haut { display: grid; gap: 12px; }
.ligne-haut { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.marque { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.marque i { width: 10px; height: 10px; border: 1.5px solid var(--encre); display: inline-block; transform: rotate(45deg); }

.progres button { flex: 1; height: 14px; padding: 6px 0; border: 0; background: transparent; cursor: pointer; }
.progres button span { display: block; height: 2px; background: var(--trait-fort); overflow: hidden; }
.progres button span b { display: block; height: 100%; width: 0; background: var(--encre); }
.progres button:focus-visible { outline: 1px solid var(--ia); }

.scene-story { position: relative; background: var(--plan); border: 1px solid var(--trait); min-height: 560px; overflow: hidden; }
.chap { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); visibility: hidden; }
.chap.actif { visibility: visible; }

  .chap { position: relative; inset: auto; grid-template-columns: minmax(0, 1fr); display: none; }
  .chap.actif { display: grid; }
}
.viz { position: relative; min-width: 0; min-height: 420px; border-right: 1px solid var(--trait); }

.viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz .pad { position: absolute; inset: 0; padding: 26px 28px; display: grid; }
.lecture { padding: 28px 28px 32px; display: grid; align-content: space-between; gap: 22px; min-width: 0; }
.numero { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; letter-spacing: -.01em; color: var(--encre); }
.numero span { font-weight: 600; font-size: 13px; color: var(--plan); background: var(--ia); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.lecture h2 { font-weight: 400; font-size: clamp(24px, 2.5vw, 32px); line-height: 1.12; letter-spacing: -.025em; margin: 8px 0 0; text-wrap: balance; }
.chiffre { font-weight: 300; font-size: clamp(54px, 6.4vw, 92px); line-height: .92; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }

.course { display: grid; align-content: center; gap: 26px; }

    <div class="reco"><div class="quand">90 jours</div><div><h3>Protéger les plongées</h3><p>Un écran toutes les 40 secondes en médiane. Regrouper les messages et la veille sur des créneaux, et suivre la durée des plus longues plongées chaque semaine.</p></div></div>
  </div></div></div>
  ${lecture({ num: "10 · Le plan", titre: "Trois actions, dans l'ordre où elles rapportent.", chiffre: `3<small>actions</small>`, texte: `Chacune vient d'une mesure de ce rapport. Le même outil remesure la semaine suivante : c'est ce qui manque à un audit classique.`,
    extra: `<div class="inconnu"><div class="mono" style="margin-bottom:4px">Ce qu'on ne sait pas encore</div><div>2 postes sur 5 ne sont pas encore audités.</div><div>Une soirée observée, pas une semaine.</div><div>P03 n'a pas de frise minute par minute.</div><div>La qualité du travail n'est pas mesurée, seulement le temps.</div></div>`,
    sources: [`<span class="badge">recommandation</span>tirée des chapitres 05 à 09`] })}`,
  init() { return {}; } });

/* ---------- Mécanique de story ---------- */
const story = document.getElementById("story"), prog = document.getElementById("progres");
chapitres.forEach((c, k) => { const s = document.createElement("section"); s.className = "chap"; s.setAttribute("aria-label", c.nom); s.innerHTML = c.html(); story.appendChild(s); c.el = s;
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Chapitre ${k + 1} : ${c.nom}`); b.innerHTML = "<span><b></b></span>"; b.addEventListener("click", () => aller(k)); prog.appendChild(b); });
let i = -1, auto = !reduit, minuteur = null;
const DUREE = 11;
function aller(k) {
  k = (k + chapitres.length) % chapitres.length;
  if (i >= 0) { chapitres[i].el.classList.remove("actif"); chapitres[i].api?.sortir?.(); }
  i = k; const c = chapitres[i];
  c.el.classList.add("actif");
  if (!c.api) c.api = c.init(c.el);
  c.api.entrer?.();
  [...prog.querySelectorAll("b")].forEach((b, j) => { if (G) G.killTweensOf(b); b.style.width = j < i ? "100%" : "0%"; });
  const barre = prog.querySelectorAll("b")[i];
  if (G && !reduit) { const lec = c.el.querySelectorAll(".lecture > *"); G.fromTo(lec, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: .55, stagger: .08, ease: "power3.out" }); }
  clearTimeout(minuteur);
  if (auto && G) { G.fromTo(barre, { width: "0%" }, { width: "100%", duration: DUREE, ease: "none" }); minuteur = setTimeout(() => aller(i + 1), DUREE * 1000); }
  else barre.style.width = "100%";
  try { history.replaceState(null, "", "#c" + (i + 1)); } catch (e) {}
}
document.getElementById("suiv").addEventListener("click", () => aller(i + 1));
document.getElementById("prec").addEventListener("click", () => aller(i - 1));
const bAuto = document.getElementById("auto");
bAuto.textContent = auto ? "Pause" : "Lecture";
bAuto.addEventListener("click", () => { auto = !auto; bAuto.textContent = auto ? "Pause" : "Lecture"; aller(i); });
addEventListener("keydown", e => { if (e.target.closest("canvas")) return; if (e.key === "ArrowRight") aller(i + 1); if (e.key === "ArrowLeft") aller(i - 1); if (e.key === " ") { e.preventDefault(); bAuto.click(); } });
const depart = Math.max(0, (parseInt((location.hash.match(/^#c(\d+)$/) || [])[1]) || 1) - 1);
(document.fonts?.ready || Promise.resolve()).then(() => aller(Math.min(depart, chapitres.length - 1)));
</script>
