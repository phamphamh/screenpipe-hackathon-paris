<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport d'audit IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Moteur de rapport par méthode. Même charte que labs/phamphamh/audit/gabarit.html : mode clair « salle de commandement »,
   gris calmes, traits fins, bleu-vert réservé à l'IA, orange aux pertes de temps. Les chapitres viennent de la méthode choisie. */
:root {
  --fond: #f4f5f7;
  --plan: #ffffff;
  --plan-2: #eef0f3;
  --trait: #e2e5ea;
  --trait-fort: #c8ced6;
  --encre: #0e141b;
  --doux: #5a6472;
  --faible: #8a93a0;
  --ia: #0b8db0;
  --ia-pale: #d7eef5;
  --projet: #2f3b4b;
  --comm: #6e7b8c;
  --reunion: #4d6079;
  --veille: #a9b3bf;
  --admin: #cbd2db;
  --systeme: #dde1e7;
  --pause: #e8ebef;
  --perte: #e0701c;
  --f-texte: "Geist", "Inter Tight", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--fond); color: var(--encre); font-family: var(--f-texte); font-size: 15px; line-height: 1.5; margin: 0; }
.cadre { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; max-width: 1320px; margin: 0 auto; padding-block: 18px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.haut { display: grid; gap: 12px; }
.ligne-haut { display: flex; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; align-items: center; }
.marque { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marque svg { flex: none; }
.marque .nom { font-weight: 600; letter-spacing: -.01em; }
.marque .insp { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.methodes { display: flex; flex-wrap: wrap; gap: 4px; }
.methodes a { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); text-decoration: none; border: 1px solid var(--trait-fort); padding: 5px 9px; background: var(--plan); }
.methodes a:hover { border-color: var(--encre); color: var(--encre); }
.methodes a.actif { background: var(--encre); color: var(--plan); border-color: var(--encre); }
.methodes a:focus-visible { outline: 1px solid var(--ia); outline-offset: 2px; }
.progres { display: flex; gap: 4px; }
.progres button { flex: 1; height: 14px; padding: 6px 0; border: 0; background: transparent; cursor: pointer; }
.progres button span { display: block; height: 2px; background: var(--trait-fort); overflow: hidden; }
.progres button span b { display: block; height: 100%; width: 0; background: var(--encre); }
.progres button:focus-visible { outline: 1px solid var(--ia); }

.scene-story { position: relative; background: var(--plan); border: 1px solid var(--trait); min-height: 580px; overflow: hidden; }
.chap { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); visibility: hidden; }
.chap.actif { visibility: visible; }
@media (max-width: 900px) {
  .scene-story { min-height: 0; }
  .chap { position: relative; inset: auto; grid-template-columns: minmax(0, 1fr); display: none; }
  .chap.actif { display: grid; }
}
.viz { position: relative; min-width: 0; min-height: 440px; border-right: 1px solid var(--trait); }
@media (max-width: 900px) { .viz { border-right: 0; border-bottom: 1px solid var(--trait); min-height: 400px; } }
.viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz .pad { position: absolute; inset: 0; padding: 26px 28px; display: grid; overflow: auto; }
.viz svg.plein { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.lecture { padding: 28px 28px 32px; display: grid; align-content: space-between; gap: 22px; min-width: 0; }
.numero { display: flex; align-items: flex-start; gap: 10px; font-weight: 500; font-size: 14px; letter-spacing: -.01em; color: var(--encre); line-height: 1.35; }
.numero span { flex: none; font-weight: 600; font-size: 13px; color: var(--plan); background: var(--ia); padding: 3px 8px; font-variant-numeric: tabular-nums; line-height: 1.35; }
.numero em { font-style: normal; padding-top: 3px; }
.lecture h2 { font-weight: 400; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.14; letter-spacing: -.025em; margin: 12px 0 0; text-wrap: balance; }
.chiffre { font-weight: 300; font-size: clamp(50px, 5.8vw, 84px); line-height: .92; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.chiffre.ia { color: var(--ia); }
.chiffre.perte { color: var(--perte); }
.chiffre small { font-size: .3em; letter-spacing: -.01em; color: var(--doux); font-weight: 400; margin-left: 6px; }
.chiffre-l { font-size: 13px; color: var(--doux); margin-top: -6px; }
.lecture p { margin: 0; color: var(--doux); max-width: 46ch; }
.lecture p b { color: var(--encre); font-weight: 500; }
.kpis { display: grid; gap: 0; border-top: 1px solid var(--trait); }
.kpi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--trait); }
.kpi b { font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px; }
.kpi b.ia { color: var(--ia); }
.kpi span { font-size: 12.5px; color: var(--doux); }

.bas { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; min-height: 36px; }
.nav { display: flex; gap: 8px; margin-left: auto; }
.nav button, .bouton { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--encre); background: var(--plan); border: 1px solid var(--trait-fort); padding: 8px 14px; cursor: pointer; }
.nav button:hover, .bouton:hover { border-color: var(--encre); }
.nav button:focus-visible, .bouton:focus-visible { outline: 1px solid var(--ia); outline-offset: 2px; }
.bouton.plein { background: var(--encre); color: var(--plan); border-color: var(--encre); justify-self: start; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.legende span { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 10.5px; color: var(--doux); letter-spacing: .04em; }
.legende i { width: 9px; height: 9px; display: inline-block; border: 1px solid rgba(14,20,27,.08); }
.legende i.pointille { border: 1px dashed var(--doux); background: transparent; }

/* état vide : quand une donnée manque, on le dit */
.vide { position: absolute; inset: 0; display: grid; place-content: center; padding: 32px; gap: 10px; text-align: left; max-width: 520px; margin: auto; }
.vide b { font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.vide p { margin: 0; color: var(--doux); font-size: 14px; }

/* étiquettes 3D (bureau) */
.etq { position: absolute; pointer-events: none; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; background: rgba(255,255,255,.94); border: 1px solid var(--trait-fort); padding: 5px 8px 6px; white-space: nowrap; line-height: 1.35; color: var(--encre); }
.etq small { display: block; color: var(--doux); font-size: 10px; }
.etq.vive { border-color: var(--ia); }
.etq.vive b { color: var(--ia); font-weight: 500; }
svg.fils { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.frise3d { position: absolute; left: 20px; right: 20px; bottom: 16px; display: grid; gap: 6px; }
.frise3d canvas { position: relative; height: 54px; cursor: ew-resize; touch-action: none; }
.horloge { position: absolute; left: 22px; top: 18px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; }

/* SVG communs */
.sv text { font-family: var(--f-texte); font-size: 12.5px; fill: var(--encre); }
.sv text.m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--doux); letter-spacing: .04em; }
.sv text.mu { font-family: var(--f-mono); font-size: 10px; fill: var(--doux); letter-spacing: .1em; text-transform: uppercase; }

/* barres empilées, liste, course, plan */
.barres { display: grid; align-content: center; gap: 18px; }
.barre-l { display: grid; gap: 6px; }
.barre-l .tete { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.barre-l .tete b { font-weight: 500; }
.barre-l .tete span { font-family: var(--f-mono); font-size: 11px; color: var(--doux); }
.pile { display: flex; height: 26px; background: var(--plan-2); overflow: hidden; }
.pile i { display: block; height: 100%; width: 0; }
.taches { display: grid; align-content: center; gap: 14px; }
.tache { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.tache .rang { font-family: var(--f-mono); font-size: 11px; color: var(--faible); grid-row: span 3; align-self: start; padding-top: 2px; }
.tache .t { font-size: 14px; }
.tache .h { font-family: var(--f-mono); font-size: 12px; color: var(--doux); text-align: right; }
.tache .rail { grid-column: 2 / -1; height: 8px; background: var(--plan-2); }
.tache .rail i { display: block; height: 100%; width: 0; }
.tache .etat { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.course { display: grid; align-content: center; gap: 26px; }
.piste { display: grid; gap: 8px; }
.piste .tete { display: flex; justify-content: space-between; gap: 10px; }
.piste .tete b { font-weight: 500; }
.piste .chrono { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.rangee { display: flex; gap: 3px; height: 40px; }
.rangee div { position: relative; height: 100%; background: var(--plan-2); overflow: hidden; }
.rangee div i { position: absolute; inset: 0 auto 0 0; width: 0; }
.rangee div span { position: absolute; left: 6px; bottom: 4px; font-family: var(--f-mono); font-size: 10px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; right: 4px; }
.plan { display: grid; align-content: center; gap: 0; }
.reco { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; padding: 18px 0; border-top: 1px solid var(--trait); }
.reco:last-child { border-bottom: 1px solid var(--trait); }
.reco .quand { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ia); text-transform: uppercase; padding-top: 3px; }
.reco h3 { margin: 0 0 4px; font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.reco p { margin: 0; color: var(--doux); font-size: 14px; }
.inconnu { display: grid; gap: 6px; }
.inconnu div { font-size: 13px; color: var(--doux); padding-left: 14px; position: relative; }
.inconnu div::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 1px; background: var(--faible); }

/* chiffre clé */
.cle { display: grid; align-content: center; gap: 28px; }
.cle .grand { font-weight: 300; font-size: clamp(76px, 10.5vw, 156px); line-height: .86; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.cle .grand.ia { color: var(--ia); }
.cle .grand small { font-size: .2em; letter-spacing: -.01em; color: var(--doux); font-weight: 400; margin-left: 10px; }
.cle .sous { font-size: 16px; color: var(--doux); max-width: 46ch; margin-top: -8px; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--trait); }
.tuile { padding: 16px 16px 4px 0; display: grid; gap: 4px; align-content: start; }
.tuile + .tuile { padding-left: 16px; border-left: 1px solid var(--trait); }
.tuile b { font-weight: 300; font-size: 34px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tuile b.ia { color: var(--ia); }
.tuile b small { font-size: 13px; color: var(--doux); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.tuile span { font-size: 12.5px; color: var(--doux); }

/* anneau */
.anneau { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.anneau .rond { position: relative; aspect-ratio: 1; width: 100%; max-width: 360px; justify-self: center; }
.anneau .rond svg { width: 100%; height: 100%; display: block; }
.anneau .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.anneau .centre b { font-weight: 300; font-size: clamp(40px, 5vw, 64px); letter-spacing: -.04em; color: var(--ia); line-height: 1; font-variant-numeric: tabular-nums; }
.anneau .centre span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); margin-top: 6px; }
.anneau .liste { display: grid; gap: 0; border-top: 1px solid var(--trait); }
.anneau .liste div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--trait); font-size: 13.5px; }
.anneau .liste i { width: 10px; height: 10px; display: block; border: 1px solid rgba(14,20,27,.08); }
.anneau .liste em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--doux); text-align: right; }
.anneau .liste strong { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
@media (max-width: 640px) { .anneau { grid-template-columns: minmax(0, 1fr); } .anneau .rond { max-width: 240px; } }

/* VSM */
.vsm { display: grid; align-content: center; gap: 14px; }
.vsm .etapes { display: grid; gap: 10px; }
.vsm .boite { border: 1.5px solid var(--encre); padding: 10px 10px 12px; display: grid; gap: 6px; align-content: start; min-height: 128px; background: var(--plan); position: relative; }
.vsm .boite.necessaire { border-color: var(--trait-fort); }
.vsm .boite.gaspillage { border-color: var(--perte); }
.vsm .boite.suppose { border-style: dashed; }
.vsm .boite .type { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.vsm .boite.valeur .type { color: var(--encre); }
.vsm .boite.gaspillage .type { color: var(--perte); }
.vsm .boite .tx { font-size: 13px; line-height: 1.3; }
.vsm .boite .app { font-family: var(--f-mono); font-size: 10px; color: var(--faible); margin-top: auto; }
.vsm .echelle { position: relative; height: 64px; }
.vsm .echelle svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.vsm .totaux { display: flex; flex-wrap: wrap; gap: 8px 22px; border-top: 1px solid var(--trait); padding-top: 12px; font-size: 13px; color: var(--doux); }
.vsm .totaux b { color: var(--encre); font-weight: 500; font-variant-numeric: tabular-nums; }
.vsm .totaux b.ia { color: var(--ia); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puces span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--perte); color: var(--perte); }
.puces span.neutre { border-color: var(--trait-fort); color: var(--doux); }
@media (max-width: 640px) { .vsm .boite { min-height: 0; } .vsm .etapes { grid-template-columns: 1fr !important; } .vsm .echelle { display: none; } }

/* carte de chaleur */
.chaleur { display: grid; align-content: center; gap: 14px; }
.grille-c { display: grid; gap: 3px; }
.grille-c .ent { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); align-self: end; padding: 0 2px 4px; line-height: 1.3; }
.grille-c .ent.ia { color: var(--ia); }
.grille-c .lib { font-size: 13px; line-height: 1.25; align-self: center; padding-right: 10px; }
.grille-c .lib small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--faible); margin-top: 2px; }
.grille-c .case { height: 54px; display: grid; align-content: center; padding: 0 8px; background: var(--plan-2); }
.grille-c .case b { font-weight: 500; font-size: 17px; line-height: 1; font-variant-numeric: tabular-nums; }
.grille-c .case span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .02em; margin-top: 3px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.echelle-c { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10px; color: var(--doux); letter-spacing: .04em; flex-wrap: wrap; }
.echelle-c i { width: 22px; height: 12px; display: inline-block; }
@media (max-width: 640px) { .grille-c .case span { display: none; } .grille-c .case { height: 40px; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="cadre">
  <div class="haut">
    <div class="ligne-haut">
      <div class="marque" id="marque"></div>
      <nav class="methodes" id="methodes" aria-label="Changer de méthode d'audit"></nav>
    </div>
    <div class="progres" id="progres" role="tablist" aria-label="Chapitres"></div>
  </div>
  <main class="scene-story" id="story"></main>
  <div class="bas">
    <div class="legende" id="legende"></div>
    <div class="nav">
      <button type="button" id="prec" aria-label="Chapitre précédent">←</button>

      <button type="button" id="suiv" aria-label="Chapitre suivant">→</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
/* Remplacés par construire.py : les données d'audit, la méthode de ce fichier, et toutes les méthodes (pour ?methode=<id>). */
const A = __DATA__;
const METHODE = __METHODE__;
const METHODES = __METHODES__;
const demande = new URLSearchParams(location.search).get("methode");
const M = (demande && METHODES.find(m => m.id === demande)) || METHODE || METHODES[0];
document.title = `Audit IA · ${M.nom}`;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
const G = window.gsap;
const CATS = { ia: "Avec l'IA", projet: "Projet et code", reunion: "Réunions", comm: "Messages", veille: "Web et veille", admin: "Administratif", systeme: "Système", pause: "Pause" };
const ORDRE = ["ia", "projet", "reunion", "comm", "veille", "admin", "systeme", "pause"];
const coul = c => css("--" + (CATS[c] ? c : "systeme"));
const D0 = A.periode.debut_min, D1 = A.periode.fin_min;
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(Math.floor(m % 60)).padStart(2, "0");
const hmin = m => m >= 59.5 ? `${Math.floor(Math.round(m) / 60)} h ${String(Math.round(m) % 60).padStart(2, "0")}` : `${Math.round(m)} min`;
const pct = x => Math.round(x * 100) + " %";
const nf = (x, d = 0) => x.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mediane = arr => { const s = arr.filter(x => x != null).sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : null; };
const dateCourte = (() => { const m = /^\d{4}-(\d{2})-(\d{2})/.exec(A.periode.debut || ""); return m ? `${m[2]}.${m[1]}` : ""; })();

/* ---------- Données dérivées (toutes calculées depuis audit.json) ---------- */
const postes = A.postes || [];
const frises = postes.filter(p => p.segments && p.segments.length);
const parCat = p => (p.mesures ? p.mesures.par_categorie_min : p.agregats_min) || {};
const actif = p => Object.values(parCat(p)).reduce((a, b) => a + b, 0);
const equipe = {}; postes.forEach(p => Object.entries(parCat(p)).forEach(([c, m]) => equipe[c] = (equipe[c] || 0) + m));
const totalEquipe = Object.values(equipe).reduce((a, b) => a + b, 0);
const partIA = totalEquipe ? (equipe.ia || 0) / totalEquipe : null;
const ensemble = (A.parallele?.ensemble_min || []).reduce((a, x) => a + x[2], 0);
const memeSujet = (A.parallele?.meme_sujet_min || []).reduce((a, x) => a + x[3], 0);
const segA = (p, m) => p.segments.find(s => s[0] <= m && m < s[1]);
const outils = A.outils || {};

/* Modèle des tâches. Hypothèse affichée : l'IA reprend TAUX de la durée des étapes de saisie, d'action et de sortie. */
const TAUX = .8, SEUIL_F = .5, AUTO = ["input", "action", "output"], HUMAIN = ["check", "decision"];
const RE_IA = /orca|claude|chatgpt|codex|cursor|gemini|copilot|mistral|perplexity|opencode/;
const ETATS = { deja: { etat: "Déjà avec l'IA", c: "--ia" }, peut: { etat: "L'IA peut le faire", c: "--perte" }, aide: { etat: "L'IA aide", c: "--projet" }, flou: { etat: "À observer", c: "--faible" } };
const taches = (A.taches || []).map(t => {
  const etapes = t.etapes || [], n = etapes.length || 1, goulots = t.goulots || [];
  const auto = etapes.filter(e => AUTO.includes(e.type)).length / n;
  const dejaIA = RE_IA.test((t.apps || []).join(" ").toLowerCase());
  const flou = goulots.includes("unclear");
  const faisab = Math.min(1, Math.max(0, auto * .8 + (goulots.includes("switching") ? .1 : 0) + (goulots.includes("waiting") ? .1 : 0) - (flou ? .3 : 0)));
  const cle = dejaIA ? "deja" : flou ? "flou" : faisab >= SEUIL_F ? "peut" : "aide";
  const heures = (t.frequence_par_semaine || 0) * (t.duree_moyenne_min || 0) / 60;
  return { ...t, etapes, goulots, apps: t.apps || [], heures, auto, faisab, dejaIA, flou, cle, expo: ETATS[cle], gain: dejaIA || flou ? 0 : auto * TAUX };
}).sort((a, b) => b.heures - a.heures);
const heuresTaches = taches.reduce((s, t) => s + t.heures, 0);
const heuresAuto = taches.reduce((s, t) => s + t.heures * t.gain, 0);
const cible = taches.filter(t => t.gain > 0).sort((a, b) => b.heures * b.gain - a.heures * a.gain)[0];
const seuilV = (() => { if (!taches.length) return 0; const h = taches.map(t => t.heures), k = Math.ceil(h.length / 2); return h.length > 1 ? (h[k - 1] + h[Math.min(k, h.length - 1)]) / 2 : h[0] / 2; })();
const quadrant = t => (t.heures >= seuilV ? (t.faisab >= SEUIL_F ? "rapides" : "chantiers") : (t.faisab >= SEUIL_F ? "marge" : "pieges"));

/* VSM de la tâche n°1 */
const RE_RETOUCHE = /corrig|relanc|refai|ressais|recopi|reprend/i;
const vsmDe = t => { if (!t || !t.etapes.length || !t.duree_moyenne_min) return null;
  const d = t.duree_moyenne_min / t.etapes.length;
  const etapes = t.etapes.map(e => ({ ...e, d, classe: RE_RETOUCHE.test(e.texte || "") ? "gaspillage" : ["action", "output"].includes(e.type) ? "valeur" : "necessaire" }));
  const va = etapes.filter(e => e.classe === "valeur").reduce((s, e) => s + e.d, 0);
  return { t, etapes, va, total: t.duree_moyenne_min, pce: va / t.duree_moyenne_min }; };
const vsm = vsmDe(taches[0]);

/* Carte de chaleur : cinq critères notés 0-3 par des règles simples sur les étapes, les apps et les goulots */
const CRITERES = [
  { id: "frequence", nom: "Fréquence", note: t => { const f = t.frequence_par_semaine || 0; return [f >= 30 ? 3 : f >= 20 ? 2 : f >= 10 ? 1 : 0, `${nf(f)}×/sem.`]; } },
  { id: "ressaisie", nom: "Ressaisie et allers-retours", note: t => { const n = t.etapes.filter(e => ["input", "output"].includes(e.type)).length, s = t.goulots.includes("switching"); return [Math.min(3, n + (s ? 1 : 0)), `${n} saisie${n > 1 ? "s" : ""}${s ? " + bascules" : ""}`]; } },
  { id: "decisions", nom: "Décisions humaines", note: t => { const n = t.etapes.filter(e => HUMAIN.includes(e.type)).length; return [Math.min(3, n), `${n} contrôle${n > 1 ? "s" : ""}`]; } },
  { id: "sensibilite", nom: "Sensibilité des données", note: t => { const x = (t.titre + " " + t.etapes.map(e => e.texte).join(" ")).toLowerCase();
      if (/pai|abonnement|factur|bancaire|banque|salaire|contrat|\brib\b|carte bleue/.test(x)) return [3, "paiement"];
      if (/mail|pièce|client|candidat|personnel|\brh\b|santé/.test(x)) return [2, "messages"];
      if (/dépôt|code|commit|repo|projet/.test(x)) return [1, "code interne"];
      return [0, "public"]; } },
  { id: "maturite", nom: "Maturité IA", ia: true, note: t => t.dejaIA ? [3, "en place"] : /\bia\b|agent|\bai\b/i.test(t.titre) ? [1, "explorée"] : [0, "aucune"] },
];
const notes = taches.map(t => ({ t, n: CRITERES.map(c => c.note(t)) }));

/* Arbre MECE : temps total → catégories → applications */
const RE_CAT = [["ia", /orca|claude|chatgpt|codex|cursor|gemini|copilot|mistral|perplexity|opencode/], ["pause", /musique|music|spotify|deezer|youtube|netflix/], ["reunion", /meet|zoom|teams/], ["comm", /discord|slack|whatsapp|gmail|outlook|messages|mail/], ["projet", /github|linear|notion|visual studio|terminal|figma/], ["admin", /agenda|calendar|drive/], ["systeme", /finder|réglages|usernotificationcenter|securityagent|loginwindow|app store/], ["veille", /chrome|firefox|safari|edge|arc|brave/]];
const categorieApp = app => (RE_CAT.find(([, r]) => r.test(app.toLowerCase())) || ["systeme"])[0];
const arbre = (() => { const t = {}; const ajout = (c, a, m) => { (t[c] ||= {}); t[c][a] = (t[c][a] || 0) + m; };
  frises.forEach(p => p.segments.forEach(s => ajout(s[2], s[5], s[1] - s[0])));
  postes.filter(p => !p.segments?.length).forEach(p => { const reste = { ...parCat(p) };
    Object.entries(outils).forEach(([app, v]) => { const m = v[p.id], c = categorieApp(app); if (!m || !reste[c]) return; const pris = Math.min(m, reste[c]); ajout(c, app, pris); reste[c] -= pris; });
    Object.entries(reste).forEach(([c, m]) => { if (m > .05) ajout(c, "Autres apps", m); }); });
  return t; })();

/* Agents : quels outils d'agents coexistent */
const appsAgents = new Set(); frises.forEach(p => p.segments.forEach(s => { if (s[3] === "agent") appsAgents.add(s[5]); }));
postes.filter(p => !p.segments?.length).forEach(p => Object.entries(outils).forEach(([app, v]) => { if (v[p.id] && /orca|codex|cursor|opencode/i.test(app)) appsAgents.add(app); }));
const outilsIA = Object.keys(outils).filter(a => RE_IA.test(a.toLowerCase()) || appsAgents.has(a));
const partsIA = postes.map(p => ({ p, v: actif(p) ? (parCat(p).ia || 0) / actif(p) : null })).filter(x => x.v != null);

/* Recommandations : chacune n'existe que si la mesure qui la justifie existe */
const recos = [];
if (appsAgents.size >= 2) recos.push({ titre: "Une seule méthode pour piloter les agents", texte: `${appsAgents.size} outillages d'agents coexistent (${[...appsAgents].join(", ")}). Écrire les consignes communes une fois, en « skills » partagées, et les brancher partout.` });
if (cible) recos.push({ titre: `Automatiser « ${cible.titre.toLowerCase()} »`, texte: `${hmin(cible.heures * 60)} par semaine aujourd'hui, dont ${hmin(cible.heures * cible.gain * 60)} que l'IA peut reprendre. Générer la skill depuis les étapes observées, puis remesurer une semaine.` });
const medEcran = mediane(frises.map(p => p.mesures?.ecran_median_s)), plongeeMax = Math.max(0, ...frises.map(p => p.mesures?.plongee?.minutes || 0));
if (medEcran) recos.push({ titre: "Protéger les plongées", texte: `Un changement d'écran toutes les ${medEcran} s en médiane. Regrouper messages et veille sur des créneaux, et suivre chaque semaine la plus longue plongée (${Math.round(plongeeMax)} min aujourd'hui).` });
if (!recos.length) recos.push({ titre: "Élargir l'observation", texte: "Les mesures disponibles ne suffisent pas encore à justifier une action. Ajouter des postes et une semaine complète d'observation." });
const limites = [];
const sansFrise = postes.filter(p => !p.segments?.length).length;
if (sansFrise) limites.push(`${sansFrise} poste${sansFrise > 1 ? "s" : ""} sur ${postes.length} sans frise minute par minute (résumé validé seulement).`);
limites.push(`Une fenêtre de ${hmin(D1 - D0)} observée, pas une semaine.`);
const postesTaches = new Set(taches.map(t => t.poste)).size;
if (taches.length) limites.push(`Tâches décrites pour ${postesTaches} poste${postesTaches > 1 ? "s" : ""} sur ${postes.length}, extrapolées à la semaine.`); else limites.push("Aucune tâche répétée décrite pour l'instant.");
limites.push("La qualité du travail n'est pas mesurée, seulement le temps.");

/* ---------- Catalogue des métriques : id → {n (nombre animé), f (format), v (valeur), u (unité), l (libellé), c (couleur)} ---------- */
const MET = {};
const met = (id, o) => { if (o.n == null && o.v == null) return; if (o.v == null) o.v = o.f(o.n); MET[id] = o; };
const hS = h => hmin(h * 60);
met("temps_total", { n: totalEquipe || null, f: hmin, l: "de travail à l'écran, tous postes" });
met("postes", { n: postes.length || null, f: x => nf(Math.round(x)), u: "postes", l: "postes observés" });
met("postes_frise", { n: frises.length, f: x => nf(Math.round(x)), u: "postes", l: "suivis minute par minute" });
met("periode", { v: `${hm(D0)} → ${hm(D1)}`, l: "fenêtre observée" });
if (partIA != null) met("part_ia", { n: partIA * 100, f: x => Math.round(x) + " %", l: "du temps d'écran avec un outil d'IA", c: "ia" });
const ag = frises.reduce((s, p) => s + (p.mesures?.ia_agent_min || 0), 0), ch = frises.reduce((s, p) => s + (p.mesures?.ia_chat_min || 0), 0);
if (ag + ch) met("part_agent", { n: ag / (ag + ch) * 100, f: x => Math.round(x) + " %", l: "du temps d'IA passe par des agents", c: "ia" });
if (partsIA.length >= 2) { const lo = Math.min(...partsIA.map(x => x.v)), hi = Math.max(...partsIA.map(x => x.v));
  met("ecart_ia", { n: Math.round((hi - lo) * 100), f: x => Math.round(x) + " pts", t: `de ${pct(lo)} à ${pct(hi)}`, l: `d'écart d'usage de l'IA entre postes (${pct(lo)} à ${pct(hi)})` }); }
const catTri = Object.entries(equipe).sort((a, b) => b[1] - a[1]);
if (catTri.length) { met("cat_1", { v: CATS[catTri[0][0]] || catTri[0][0], l: "premier poste de temps" }); met("cat_1_part", { n: catTri[0][1] / totalEquipe * 100, f: x => Math.round(x) + " %", l: `du temps dans « ${CATS[catTri[0][0]]} »`, c: catTri[0][0] === "ia" ? "ia" : null }); }
if (frises.length) {
  met("ecran_median_s", { n: medEcran, f: x => Math.round(x) + " s", l: "par écran, en médiane, avant de changer" });
  const bph = frises.reduce((s, p) => s + (p.mesures?.bascules_par_heure || 0), 0) / frises.length;
  met("bascules_heure", { n: bph, f: x => nf(x, 1), u: "par heure", t: `${nf(bph, 1)} changements d'application par heure en moyenne`, l: "changements d'application par heure" });
  met("plongee_max", { n: plongeeMax, f: x => Math.round(x) + " min", l: "la plus longue plongée sans décrocher" });
  met("minutes_ensemble", { n: ensemble, f: hmin, l: "à l'écran en même temps" });
  met("meme_sujet_min", { n: memeSujet, f: hmin, l: "sur le même sujet en même temps" });
}
met("outils", { n: Object.keys(outils).length, f: x => nf(Math.round(x)), u: "outils", l: "outils utilisés plus de 3 min" });
met("outils_partages", { n: Object.values(outils).filter(v => Object.keys(v).length >= 2).length, f: x => nf(Math.round(x)), u: "outils", l: "outils partagés par plusieurs postes" });
met("outils_ia", { n: outilsIA.length, f: x => nf(Math.round(x)), u: "outils", l: `outils d'IA en usage (${outilsIA.join(", ")})`, c: "ia" });
if (taches.length) {
  met("taches", { n: taches.length, f: x => nf(Math.round(x)), u: "tâches", l: "tâches répétées décrites" });
  met("heures_taches", { n: heuresTaches * 60, f: hmin, u: "par semaine", l: "de tâches répétées par semaine" });
  met("heures_automatisables", { n: heuresAuto * 60, f: hmin, u: "par semaine", l: "par semaine que l'IA peut reprendre", c: "ia" });
  met("heures_restantes", { n: (heuresTaches - heuresAuto) * 60, f: hmin, u: "par semaine", l: "par semaine qui restent humaines" });
  met("heures_an", { n: heuresAuto * 47, f: x => nf(Math.round(x)) + " h", u: "par an", l: "rendues sur une année de 47 semaines", c: "ia" });
  met("jours_an", { n: heuresAuto * 47 / 7, f: x => nf(Math.round(x)), u: "jours", l: "de travail de 7 h rendus par an", c: "ia" });
  met("gains_rapides", { n: taches.filter(t => quadrant(t) === "rapides").length, f: x => nf(Math.round(x)), u: "tâches", l: "tâches en « gains rapides »" });
  met("taches_deja_ia", { n: taches.filter(t => t.dejaIA).length, f: x => nf(Math.round(x)), u: "tâches", l: "tâches déjà faites avec l'IA", c: "ia" });
  met("taches_sensibles", { n: notes.filter(x => x.n[3][0] >= 2).length, f: x => nf(Math.round(x)), u: "tâches", l: "tâches qui touchent des données sensibles" });
  met("tache_1", { v: taches[0].titre, l: "tâche n°1 en heures par semaine" });
  met("tache_1_heures", { n: taches[0].heures * 60, f: hmin, u: "par semaine", l: `pour « ${taches[0].titre} »` });
}
if (cible) { met("cible", { v: cible.titre, l: "tâche à automatiser en premier" }); met("cible_gain", { n: cible.heures * cible.gain * 60, f: hmin, u: "par semaine", l: `rendues sur « ${cible.titre} »`, c: "ia" }); }
if (vsm) met("pce", { n: vsm.pce * 100, f: x => Math.round(x) + " %", l: "du temps de traversée à valeur ajoutée (PCE)" });
met("actions", { n: recos.length, f: x => nf(Math.round(x)), u: recos.length > 1 ? "actions" : "action", l: "actions issues des mesures" });

/* Texte des méthodes : {id} remplacé par la valeur ; une métrique absente devient « n.d. » */
const remplir = s => String(s || "").replace(/\{([a-z0-9_]+)\}/g, (_, id) => MET[id] ? esc(MET[id].t || MET[id].v) : "n.d.");

/* ---------- Outils communs ---------- */
function toile(c) { const r = c.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); if (c.width !== Math.round(r.width * d) || c.height !== Math.round(r.height * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); } const x = c.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, r.width, r.height); return { x, w: r.width, h: r.height }; }
const NS = "http://www.w3.org/2000/svg";
function S(parent, tag, attrs = {}, texte) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (texte != null) e.textContent = texte; parent.appendChild(e); return e; }
const coupe = (s, max) => { const mots = String(s).split(" "), out = []; let l = ""; mots.forEach(m => { if ((l + " " + m).trim().length > max && l) { out.push(l); l = m; } else l = (l + " " + m).trim(); }); if (l) out.push(l); return out; };
const tween = (duree, maj, ease = "power2.out", delai = 0) => { if (G && !reduit) { const o = { v: 0 }; return G.to(o, { v: 1, duration: duree, ease, delay: delai, onUpdate: () => maj(o.v) }); } maj(1); };
const vide = (titre, texte) => ({ html: `<div class="viz"><div class="vide"><span class="mono">Donnée manquante</span><b>${titre}</b><p>${texte}</p></div></div>`, init: () => ({}) });
const legCats = cats => ORDRE.filter(c => cats[c]).map(c => `<span><i style="background:${coul(c)}"></i>${CATS[c]}</span>`).join("");
const legEtats = () => Object.values(ETATS).filter(e => taches.some(t => t.expo === e)).map(e => `<span><i style="background:var(${e.c})"></i>${e.etat}</span>`).join("");
function compter(el) { el.querySelectorAll("[data-met]").forEach(x => { const m = MET[x.dataset.met]; if (!m || m.n == null || !m.f) return; const val = x.querySelector(".val") || x; tween(1.2, p => val.textContent = m.f(m.n * p), "power2.out"); val.textContent = m.f(G && !reduit ? 0 : m.n); }); }

/* three.js, comme la couverture de l'audit */
function monter3d(canvas, construire) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(css("--plan"));
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200); cam.position.set(22, 19, 22); cam.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced6, 2.1));
  const s = new THREE.DirectionalLight(0xffffff, 1.6); s.position.set(-8, 20, 12); s.castShadow = true; s.shadow.mapSize.set(2048, 2048);
  Object.assign(s.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); s.shadow.radius = 6; scene.add(s);
  const maj = construire(scene, cam);
  let largeur = 0, hauteur = 0, prec = null, vivant = false;
  function rendu(t) {
    const r = canvas.getBoundingClientRect();
    if (r.width && (r.width !== largeur || r.height !== hauteur)) { largeur = r.width; hauteur = r.height; renderer.setSize(r.width, r.height, false);
      const a = r.width / r.height, v = maj.vue(a); cam.left = -v * a; cam.right = v * a; cam.top = v; cam.bottom = -v; cam.updateProjectionMatrix(); }
    const dt = prec === null ? 0 : Math.min(.05, (t - prec) / 1000); prec = t;
    maj(t, dt, r); renderer.render(scene, cam); maj.apres?.(r);
    if (vivant) requestAnimationFrame(rendu);
  }
  return { demarrer() { if (!vivant) { vivant = true; prec = null; requestAnimationFrame(rendu); } }, arreter() { vivant = false; }, cam };
}
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .9, metalness: 0 });
const aretes = (m, op = .28) => { m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x5a6472, transparent: true, opacity: op }))); return m; };

/* ---------- Renderers : un par type de viz. Chacun renvoie { html, init(el) → {entrer, sortir, redessiner}, defaut, legende, extra, sansChiffre } ---------- */
const VIZ = {};

VIZ["chiffre-cle"] = ch => {
  const ids = (ch.metriques || []).filter(id => MET[id] && MET[id].n != null);
  if (!ids.length) ids.push(...["temps_total", "part_ia", "postes"].filter(id => MET[id]));
  if (!ids.length) return vide("Aucun chiffre disponible.", "Les données d'audit ne contiennent encore aucune mesure.");
  const [p, ...autres] = ids, m = MET[p];
  return { sansChiffre: true, html: `<div class="viz"><div class="pad"><div class="cle">
      <div class="grand${m.c === "ia" ? " ia" : ""}" data-met="${p}"><span class="val">${esc(m.v)}</span>${m.u ? `<small>${esc(m.u)}</small>` : ""}</div>
      <div class="sous">${esc(m.l)}</div>
      ${autres.length ? `<div class="tuiles">${autres.slice(0, 3).map(id => `<div class="tuile"><b class="${MET[id].c === "ia" ? "ia" : ""}" data-met="${id}"><span class="val">${esc(MET[id].v)}</span>${MET[id].u ? `<small>${esc(MET[id].u)}</small>` : ""}</b><span>${esc(MET[id].l)}</span></div>`).join("")}</div>` : ""}
    </div></div></div>`,
    init(el) { const items = [...el.querySelectorAll(".cle > *, .tuile")];
      return { entrer() { compter(el.querySelector(".viz")); if (G && !reduit) G.fromTo(items, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .7, stagger: .1, ease: "power3.out" }); } }; } };
};

VIZ["bureau-3d"] = () => ({ defaut: "temps_total", legende: legCats(equipe), html: `
  <div class="viz"><canvas data-r="bureau" aria-label="Maquette 3D du bureau animée sur la soirée"></canvas><svg class="fils"></svg><div class="etqs"></div>
    <div class="horloge"></div>
    <div class="frise3d"><canvas data-r="frise" tabindex="0" aria-label="Frise de la soirée, glisser pour remonter le temps"></canvas></div></div>`,
  init(el) {
    const frise = el.querySelector('[data-r="frise"]'), fils = el.querySelector(".fils"), etqs = el.querySelector(".etqs"), horloge = el.querySelector(".horloge");
    let temps = D0 + 60, glisse = false;
    const p3 = monter3d(el.querySelector('[data-r="bureau"]'), (scene) => {
      const sol = aretes(new THREE.Mesh(new THREE.BoxGeometry(22, .3, 15), mat(0xf0f2f5)), .35); sol.position.y = -.15; sol.receiveShadow = true; scene.add(sol);
      const grille = new THREE.GridHelper(22, 44, 0xdfe3e8, 0xe9ecf0); grille.position.y = .01; grille.scale.z = 15 / 22; scene.add(grille);
      [[0, 1, -7.5, 22, 2, .12], [-11, 1, 0, .12, 2, 15]].forEach(([x, y, z, w, h, d]) => { const m = aretes(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(0xe6e9ed)), .25); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); });
      const table = aretes(new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, .1, 48), mat(0xffffff))); table.position.set(6.5, .78, 3); table.castShadow = true; scene.add(table);

const ICONES = {
  pyramide: `<path d="M11 3 L20 19 H2 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 12 H15.5" stroke="currentColor" stroke-width="1.2"/>`,
  matrice: `<rect x="3" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="3" width="7" height="7" fill="var(--ia)" stroke="var(--ia)" stroke-width="1.5"/><rect x="3" y="12" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="12" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/>`,
  flux: `<path d="M2 11 H16 M12 6 L17 11 L12 16" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="5" width="4" height="12" fill="none" stroke="currentColor" stroke-width="1.2"/>`,
  confiance: `<path d="M11 2.5 L18.5 5.5 V11 C18.5 15.5 15 18.5 11 19.5 C7 18.5 3.5 15.5 3.5 11 V5.5 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 11 L10 13.5 L14.5 8.5" fill="none" stroke="var(--ia)" stroke-width="1.6"/>`,
  resultats: `<path d="M3 19 V13 M8.5 19 V9 M14 19 V6 M19.5 19 V3" stroke="currentColor" stroke-width="2.2"/>`,
};
document.getElementById("marque").innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="color:var(--encre)">${ICONES[M.id] || `<rect x="6" y="6" width="10" height="10" transform="rotate(45 11 11)" fill="none" stroke="currentColor" stroke-width="1.5"/>`}</svg>
  <div><div class="nom">Méthode ${esc(M.nom)}</div><div class="insp">inspirée de ${esc(M.inspire_de)}</div></div>`;
document.getElementById("methodes").innerHTML = METHODES.map(m => `<a href="?methode=${encodeURIComponent(m.id)}" class="${m.id === M.id ? "actif" : ""}"${m.id === M.id ? ' aria-current="page"' : ""}>${esc(m.nom)}</a>`).join("");

const lectureHtml = (ch, k, r) => {
  const ids = (ch.metriques || []).filter(id => MET[id] && MET[id].n != null);
  const principal = r.sansChiffre ? null : (ids[0] || (MET[r.defaut] && MET[r.defaut].n != null ? r.defaut : null));
  const autres = r.sansChiffre ? [] : ids.filter(id => id !== principal).slice(0, 2);
  const m = principal && MET[principal];
  return `<div class="lecture"><div><div class="numero"><span>${String(k + 1).padStart(2, "0")}</span><em>${remplir(ch.question)}</em></div><h2>${remplir(ch.titre)}</h2></div>
    <div style="display:grid;gap:14px">
      ${m ? `<div class="chiffre${m.c === "ia" ? " ia" : ""}" data-met="${principal}"><span class="val">${esc(m.v)}</span>${m.u ? `<small>${esc(m.u)}</small>` : ""}</div><div class="chiffre-l">${esc(m.l)}</div>` : ""}
      ${ch.lecture ? `<p>${remplir(ch.lecture).replace(/&lt;(\/?)b&gt;/g, "<$1b>")}</p>` : ""}
      ${autres.length ? `<div class="kpis">${autres.map(id => { const x = MET[id], court = x.t && x.t.length < 18; return `<div class="kpi"><b class="${x.c === "ia" ? "ia" : ""}">${esc(court ? x.t : x.v + (x.u ? " " + x.u : ""))}</b><span>${esc(x.l)}</span></div>`; }).join("")}</div>` : ""}
      ${r.extra || ""}
    </div></div>`;
};

const chapitres = (M.chapitres || []).map((ch, k) => {
  let r; try { r = (VIZ[ch.viz] || (() => vide(`Visualisation « ${esc(ch.viz)} » pas encore disponible.`, "Le chapitre est décrit par la méthode, mais ce moteur ne sait pas encore le dessiner.")))(ch); }
  catch (e) { console.warn(e); r = vide("Ce chapitre n'a pas pu être calculé.", "Les données d'audit ne permettent pas de le construire."); }
  return { ch, r, nom: remplir(ch.question || ch.id), html: () => r.html + lectureHtml(ch, k, r) };
});

/* ---------- Mécanique de story ---------- */
const story = document.getElementById("story"), prog = document.getElementById("progres"), legende = document.getElementById("legende");
chapitres.forEach((c, k) => { const s = document.createElement("section"); s.className = "chap"; s.setAttribute("aria-label", c.nom.replace(/<[^>]+>/g, "")); s.innerHTML = c.html(); story.appendChild(s); c.el = s;
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Chapitre ${k + 1}`); b.innerHTML = "<span><b></b></span>"; b.addEventListener("click", () => aller(k)); prog.appendChild(b); });
let i = -1, auto = !reduit, minuteur = null;
const DUREE = 11;
function aller(k) {
  if (!chapitres.length) return;
  k = (k + chapitres.length) % chapitres.length;
  if (i >= 0) { chapitres[i].el.classList.remove("actif"); chapitres[i].api?.sortir?.(); }
  i = k; const c = chapitres[i];
  c.el.classList.add("actif");
  if (!c.api) { try { c.api = c.r.init(c.el) || {}; } catch (e) { console.warn(e); c.api = {}; } }
  try { c.api.entrer?.(); } catch (e) { console.warn(e); }
  legende.innerHTML = c.r.legende || "";
  compter(c.el.querySelector(".lecture"));
  [...prog.querySelectorAll("b")].forEach((b, j) => { if (G) G.killTweensOf(b); b.style.width = j < i ? "100%" : "0%"; });
  const barre = prog.querySelectorAll("b")[i];
  if (G && !reduit) { const lec = c.el.querySelectorAll(".lecture > *"); G.fromTo(lec, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: .55, stagger: .08, ease: "power3.out" }); }
  clearTimeout(minuteur);
  if (auto && G) { G.fromTo(barre, { width: "0%" }, { width: "100%", duration: DUREE, ease: "none" }); minuteur = setTimeout(() => aller(i + 1), DUREE * 1000); }
  else barre.style.width = "100%";
  try { history.replaceState(null, "", location.search + "#c" + (i + 1)); } catch (e) {}
}
document.getElementById("suiv").addEventListener("click", () => aller(i + 1));
document.getElementById("prec").addEventListener("click", () => aller(i - 1));
const bAuto = document.getElementById("auto");
bAuto.textContent = auto ? "Pause" : "Lecture";
bAuto.addEventListener("click", () => { auto = !auto; bAuto.textContent = auto ? "Pause" : "Lecture"; aller(i); });
addEventListener("keydown", e => { if (e.target.closest("canvas")) return; if (e.key === "ArrowRight") aller(i + 1); if (e.key === "ArrowLeft") aller(i - 1); if (e.key === " ") { e.preventDefault(); bAuto.click(); } });
let attente = null;
addEventListener("resize", () => { clearTimeout(attente); attente = setTimeout(() => { const c = chapitres[i]; c?.api?.redessiner?.(); }, 120); });
const depart = Math.max(0, (parseInt((location.hash.match(/^#c(\d+)$/) || [])[1]) || 1) - 1);
(document.fonts?.ready || Promise.resolve()).then(() => aller(Math.min(depart, chapitres.length - 1)));
</script>
