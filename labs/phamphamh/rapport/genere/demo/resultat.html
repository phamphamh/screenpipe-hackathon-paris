<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport d'audit IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Moteur de rapport par méthode. Même charte que labs/phamphamh/audit/gabarit.html : mode clair « salle de commandement »,
   gris calmes, traits fins, bleu-vert réservé à l'IA, orange aux pertes de temps. Les chapitres viennent de la méthode choisie. */
:root {
  --fond: #f4f5f7;
  --plan: #ffffff;
  --plan-2: #eef0f3;
  --trait: #e2e5ea;
  --trait-fort: #c8ced6;
  --encre: #0e141b;
  --doux: #5a6472;
  --faible: #8a93a0;
  --ia: #0b8db0;
  --ia-pale: #d7eef5;
  --projet: #2f3b4b;
  --comm: #6e7b8c;
  --reunion: #4d6079;
  --veille: #a9b3bf;
  --admin: #cbd2db;
  --systeme: #dde1e7;
  --pause: #e8ebef;
  --perte: #e0701c;
  --f-texte: "Geist", "Inter Tight", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--fond); color: var(--encre); font-family: var(--f-texte); font-size: 15px; line-height: 1.5; margin: 0; }
.cadre { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; max-width: 1320px; margin: 0 auto; padding-block: 18px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.haut { display: grid; gap: 12px; }
.ligne-haut { display: flex; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; align-items: center; }
.marque { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marque svg { flex: none; }
.marque .nom { font-weight: 600; letter-spacing: -.01em; }
.marque .insp { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.methodes { display: flex; flex-wrap: wrap; gap: 4px; }
.methodes a { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); text-decoration: none; border: 1px solid var(--trait-fort); padding: 5px 9px; background: var(--plan); }
.methodes a:hover { border-color: var(--encre); color: var(--encre); }
.methodes a.actif { background: var(--encre); color: var(--plan); border-color: var(--encre); }
.methodes a:focus-visible { outline: 1px solid var(--ia); outline-offset: 2px; }
.progres { display: flex; gap: 4px; }
.progres button { flex: 1; height: 14px; padding: 6px 0; border: 0; background: transparent; cursor: pointer; }
.progres button span { display: block; height: 2px; background: var(--trait-fort); overflow: hidden; }
.progres button span b { display: block; height: 100%; width: 0; background: var(--encre); }
.progres button:focus-visible { outline: 1px solid var(--ia); }

.scene-story { position: relative; background: var(--plan); border: 1px solid var(--trait); min-height: 580px; overflow: hidden; }
.chap { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); visibility: hidden; }
.chap.actif { visibility: visible; }
@media (max-width: 900px) {
  .scene-story { min-height: 0; }
  .chap { position: relative; inset: auto; grid-template-columns: minmax(0, 1fr); display: none; }
  .chap.actif { display: grid; }
}
.viz { position: relative; min-width: 0; min-height: 440px; border-right: 1px solid var(--trait); }
@media (max-width: 900px) { .viz { border-right: 0; border-bottom: 1px solid var(--trait); min-height: 400px; } .chap .viz .pad { position: relative; min-height: 400px; padding: 22px 16px; } .chap .viz .cont-cascade { min-height: 460px !important; } }
.viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz .pad { position: absolute; inset: 0; padding: 26px 28px; display: grid; overflow: auto; }
.viz svg.plein { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.lecture { padding: 28px 28px 32px; display: grid; align-content: space-between; gap: 22px; min-width: 0; }
.numero { display: flex; align-items: flex-start; gap: 10px; font-weight: 500; font-size: 14px; letter-spacing: -.01em; color: var(--encre); line-height: 1.35; }
.numero span { flex: none; font-weight: 600; font-size: 13px; color: var(--plan); background: var(--ia); padding: 3px 8px; font-variant-numeric: tabular-nums; line-height: 1.35; }
.numero em { font-style: normal; padding-top: 3px; }
.lecture h2 { font-weight: 400; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.14; letter-spacing: -.025em; margin: 12px 0 0; text-wrap: balance; }
.chiffre { font-weight: 300; font-size: clamp(50px, 5.8vw, 84px); line-height: .92; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.chiffre.ia { color: var(--ia); }
.chiffre.perte { color: var(--perte); }
.chiffre small { font-size: .3em; letter-spacing: -.01em; color: var(--doux); font-weight: 400; margin-left: 6px; }
.chiffre-l { font-size: 13px; color: var(--doux); margin-top: -6px; }
.lecture p { margin: 0; color: var(--doux); max-width: 46ch; }
.lecture p b { color: var(--encre); font-weight: 500; }
.kpis { display: grid; gap: 0; border-top: 1px solid var(--trait); }
.kpi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--trait); }
.kpi b { font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px; }
.kpi b.ia { color: var(--ia); }
.kpi span { font-size: 12.5px; color: var(--doux); }

.bas { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; min-height: 36px; }
.nav { display: flex; gap: 8px; margin-left: auto; }
.nav button, .bouton { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--encre); background: var(--plan); border: 1px solid var(--trait-fort); padding: 8px 14px; cursor: pointer; }
.nav button:hover, .bouton:hover { border-color: var(--encre); }
.nav button:focus-visible, .bouton:focus-visible { outline: 1px solid var(--ia); outline-offset: 2px; }
.bouton.plein { background: var(--encre); color: var(--plan); border-color: var(--encre); justify-self: start; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.legende span { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 10.5px; color: var(--doux); letter-spacing: .04em; }
.legende i { width: 9px; height: 9px; display: inline-block; border: 1px solid rgba(14,20,27,.08); }
.legende i.pointille { border: 1px dashed var(--doux); background: transparent; }

/* état vide : quand une donnée manque, on le dit */
.vide { position: absolute; inset: 0; display: grid; place-content: center; padding: 32px; gap: 10px; text-align: left; max-width: 520px; margin: auto; }
.vide b { font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.vide p { margin: 0; color: var(--doux); font-size: 14px; }

/* étiquettes 3D (bureau) */
.etq { position: absolute; pointer-events: none; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; background: rgba(255,255,255,.94); border: 1px solid var(--trait-fort); padding: 5px 8px 6px; white-space: nowrap; line-height: 1.35; color: var(--encre); }
.etq small { display: block; color: var(--doux); font-size: 10px; }
.etq.vive { border-color: var(--ia); }
.etq.vive b { color: var(--ia); font-weight: 500; }
svg.fils { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.frise3d { position: absolute; left: 20px; right: 20px; bottom: 16px; display: grid; gap: 6px; }
.frise3d canvas { position: relative; height: 54px; cursor: ew-resize; touch-action: none; }
.horloge { position: absolute; left: 22px; top: 18px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; }

/* SVG communs */
.sv text { font-family: var(--f-texte); font-size: 12.5px; fill: var(--encre); }
.sv text.m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--doux); letter-spacing: .04em; }
.sv text.mu { font-family: var(--f-mono); font-size: 10px; fill: var(--doux); letter-spacing: .1em; text-transform: uppercase; }

/* barres empilées, liste, course, plan */
.barres { display: grid; align-content: center; gap: 18px; }
.barre-l { display: grid; gap: 6px; }
.barre-l .tete { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.barre-l .tete b { font-weight: 500; }
.barre-l .tete span { font-family: var(--f-mono); font-size: 11px; color: var(--doux); }
.pile { display: flex; height: 26px; background: var(--plan-2); overflow: hidden; }
.pile i { display: block; height: 100%; width: 0; }
.taches { display: grid; align-content: center; gap: 14px; }
.tache { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.tache .rang { font-family: var(--f-mono); font-size: 11px; color: var(--faible); grid-row: span 3; align-self: start; padding-top: 2px; }
.tache .t { font-size: 14px; }
.tache .h { font-family: var(--f-mono); font-size: 12px; color: var(--doux); text-align: right; }
.tache .rail { grid-column: 2 / -1; height: 8px; background: var(--plan-2); }
.tache .rail i { display: block; height: 100%; width: 0; }
.tache .etat { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.course { display: grid; align-content: center; gap: 26px; }
.piste { display: grid; gap: 8px; }
.piste .tete { display: flex; justify-content: space-between; gap: 10px; }
.piste .tete b { font-weight: 500; }
.piste .chrono { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.rangee { display: flex; gap: 3px; height: 40px; }
.rangee div { position: relative; height: 100%; background: var(--plan-2); overflow: hidden; }
.rangee div i { position: absolute; inset: 0 auto 0 0; width: 0; }
.rangee div span { position: absolute; left: 6px; bottom: 4px; font-family: var(--f-mono); font-size: 10px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; right: 4px; }
.plan { display: grid; align-content: center; gap: 0; }
.reco { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; padding: 18px 0; border-top: 1px solid var(--trait); }
.reco:last-child { border-bottom: 1px solid var(--trait); }
.reco .quand { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ia); text-transform: uppercase; padding-top: 3px; }
.reco h3 { margin: 0 0 4px; font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.reco p { margin: 0; color: var(--doux); font-size: 14px; }
.inconnu { display: grid; gap: 6px; }
.inconnu div { font-size: 13px; color: var(--doux); padding-left: 14px; position: relative; }
.inconnu div::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 1px; background: var(--faible); }

/* chiffre clé */
.cle { display: grid; align-content: center; gap: 28px; }
.cle .grand { font-weight: 300; font-size: clamp(76px, 10.5vw, 156px); line-height: .86; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.cle .grand.ia { color: var(--ia); }
.cle .grand small { font-size: .2em; letter-spacing: -.01em; color: var(--doux); font-weight: 400; margin-left: 10px; }
.cle .sous { font-size: 16px; color: var(--doux); max-width: 46ch; margin-top: -8px; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--trait); }
.tuile { padding: 16px 16px 4px 0; display: grid; gap: 4px; align-content: start; }
.tuile + .tuile { padding-left: 16px; border-left: 1px solid var(--trait); }
.tuile b { font-weight: 300; font-size: 34px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tuile b.ia { color: var(--ia); }
.tuile b small { font-size: 13px; color: var(--doux); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.tuile > span { font-size: 12.5px; color: var(--doux); }

/* anneau */
.anneau { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.anneau .rond { position: relative; aspect-ratio: 1; width: 100%; max-width: 360px; justify-self: center; }
.anneau .rond svg { width: 100%; height: 100%; display: block; }
.anneau .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.anneau .centre b { font-weight: 300; font-size: clamp(40px, 5vw, 64px); letter-spacing: -.04em; color: var(--ia); line-height: 1; font-variant-numeric: tabular-nums; }
.anneau .centre span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); margin-top: 6px; }
.anneau .liste { display: grid; gap: 0; border-top: 1px solid var(--trait); }
.anneau .liste div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--trait); font-size: 13.5px; }
.anneau .liste i { width: 10px; height: 10px; display: block; border: 1px solid rgba(14,20,27,.08); }
.anneau .liste em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--doux); text-align: right; }
.anneau .liste strong { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
@media (max-width: 640px) { .anneau { grid-template-columns: minmax(0, 1fr); } .anneau .rond { max-width: 240px; } }

/* VSM */
.vsm { display: grid; align-content: center; gap: 14px; }
.vsm .etapes { display: grid; gap: 10px; }
.vsm .boite { border: 1.5px solid var(--encre); padding: 10px 10px 12px; display: grid; gap: 6px; align-content: start; min-height: 128px; background: var(--plan); position: relative; }
.vsm .boite.necessaire { border-color: var(--trait-fort); }
.vsm .boite.gaspillage { border-color: var(--perte); }
.vsm .boite.suppose { border-style: dashed; }
.vsm .boite .type { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); }
.vsm .boite.valeur .type { color: var(--encre); }
.vsm .boite.gaspillage .type { color: var(--perte); }
.vsm .boite .tx { font-size: 13px; line-height: 1.3; }
.vsm .boite .app { font-family: var(--f-mono); font-size: 10px; color: var(--faible); margin-top: auto; }
.vsm .echelle { position: relative; height: 64px; }
.vsm .echelle svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.vsm .totaux { display: flex; flex-wrap: wrap; gap: 8px 22px; border-top: 1px solid var(--trait); padding-top: 12px; font-size: 13px; color: var(--doux); }
.vsm .totaux b { color: var(--encre); font-weight: 500; font-variant-numeric: tabular-nums; }
.vsm .totaux b.ia { color: var(--ia); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puces span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--perte); color: var(--perte); }
.puces span.neutre { border-color: var(--trait-fort); color: var(--doux); }
@media (max-width: 640px) { .vsm .boite { min-height: 0; } .vsm .etapes { grid-template-columns: 1fr !important; } .vsm .echelle { display: none; } }

/* carte de chaleur */
.chaleur { display: grid; align-content: center; gap: 14px; }
.grille-c { display: grid; gap: 3px; }
.grille-c .ent { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); align-self: end; padding: 0 2px 4px; line-height: 1.3; }
.grille-c .ent.ia { color: var(--ia); }
.grille-c .lib { font-size: 13px; line-height: 1.25; align-self: center; padding-right: 10px; }
.grille-c .lib small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--faible); margin-top: 2px; }
.grille-c .case { height: 54px; display: grid; align-content: center; padding: 0 8px; background: var(--plan-2); }
.grille-c .case b { font-weight: 500; font-size: 17px; line-height: 1; font-variant-numeric: tabular-nums; }
.grille-c .case span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .02em; margin-top: 3px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.echelle-c { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10px; color: var(--doux); letter-spacing: .04em; flex-wrap: wrap; }
.echelle-c i { width: 22px; height: 12px; display: inline-block; }
@media (max-width: 640px) { .grille-c .case span { display: none; } .grille-c .case { height: 40px; padding: 0 4px; } .grille-c .case b { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .grille-c { grid-template-columns: minmax(96px, 1.3fr) repeat(var(--n, 5), minmax(0, 1fr)) !important; } .grille-c .lib { font-size: 11.5px; } .grille-c .ent { font-size: 8.5px; letter-spacing: .02em; } }
.cle-mat { display: none; }
@media (max-width: 640px) { .viz:has(.cle-mat) svg.plein { position: relative; height: 380px; } .cle-mat { display: block; margin: 0; padding: 4px 16px 16px 34px; font-size: 12.5px; color: var(--doux); } .cle-mat li { padding: 2px 0; } }

.nd { font-size: 12.5px; color: var(--faible); border-left: 2px solid var(--trait-fort); padding-left: 10px; max-width: 46ch; }
.nd span { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); margin-bottom: 2px; }
.vsm .boite.agent { border-color: var(--ia); background: color-mix(in srgb, var(--ia-pale) 60%, var(--plan)); }
.vsm .boite.agent .type { color: var(--ia); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="cadre">
  <div class="haut">
    <div class="ligne-haut">
      <div class="marque" id="marque"></div>
      <nav class="methodes" id="methodes" aria-label="Changer de méthode d'audit"></nav>
    </div>
    <div class="progres" id="progres" role="tablist" aria-label="Chapitres"></div>
  </div>
  <main class="scene-story" id="story"></main>
  <div class="bas">
    <div class="legende" id="legende"></div>
    <div class="nav">
      <button type="button" id="prec" aria-label="Chapitre précédent">←</button>

      <button type="button" id="suiv" aria-label="Chapitre suivant">→</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">

const paireTop = Object.entries(paires).sort((a, b) => b[1] - a[1])[0];

/* Attention, terrain heure par heure */
const medEcran = mediane(frises.map(p => p.mesures?.ecran_median_s));
const plongeur = frises.slice().sort((a, b) => (b.mesures?.plongee?.minutes || 0) - (a.mesures?.plongee?.minutes || 0))[0];
const plongeeMax = plongeur?.mesures?.plongee?.minutes || 0;
const PAS = 30, T0 = Math.floor(D0 / PAS) * PAS, creneaux = []; for (let m = T0; m < D1; m += PAS) creneaux.push(m);
const fragments = frises.map(p => ({ p, n: creneaux.map(m => p.segments.filter((s, i) => i && s[0] >= m && s[0] < m + PAS && s[5] !== p.segments[i - 1][5]).length),
  actif: creneaux.map(m => p.segments.reduce((s, x) => s + Math.max(0, Math.min(m + PAS, x[1]) - Math.max(m, x[0])), 0)) }));
const creneauMax = (() => { if (!fragments.length) return null; const tot = creneaux.map((_, k) => fragments.reduce((s, f) => s + f.n[k], 0)); const k = tot.indexOf(Math.max(...tot)); return tot[k] ? `${hm(creneaux[k])}–${hm(creneaux[k] + PAS)}` : null; })();

/* VSM du flux à améliorer (la tâche n°1 à automatiser), état actuel et état cible */
const vsmDe = t => { if (!t || !t.etapes.length || !t.duree_moyenne_min) return null;
  const d = t.duree_moyenne_min / t.etapes.length;
  const etapes = t.etapes.map(e => ({ ...e, d, classe: RE_RETOUCHE.test(e.texte || "") ? "gaspillage" : ["action", "output"].includes(e.type) ? "valeur" : "necessaire" }));
  const va = etapes.filter(e => e.classe === "valeur").reduce((s, e) => s + e.d, 0);
  const apres = etapes.map(e => ({ ...e, agent: AUTO.includes(e.type) && !t.dejaIA, d2: AUTO.includes(e.type) && !t.dejaIA ? e.d * (1 - TAUX) : e.d }));
  return { t, etapes, apres, va, total: t.duree_moyenne_min, pce: va / t.duree_moyenne_min, cible: apres.reduce((s, e) => s + e.d2, 0) }; };
const vsm = vsmDe(flux);

/* Gaspillages (8 du Lean), en minutes par semaine quand c'est mesurable */
const parSemaine = filtre => taches.reduce((s, t) => s + t.etapes.filter(filtre).length * (t.duree_moyenne_min / (t.etapes.length || 1)) * t.frequence_par_semaine, 0);
const nGoulot = g => taches.filter(t => t.goulots.includes(g)).length;
const GASPILLAGES = [
  { nom: "Défauts et reprises", m: taches.length ? parSemaine(e => RE_RETOUCHE.test(e.texte || "")) : null, n: nGoulot("rework"), quoi: "reprises" },
  { nom: "Surproduction", m: null, quoi: "travail produit avant d'être demandé" },
  { nom: "Attente", m: null, n: nGoulot("waiting"), quoi: "la durée des attentes" },
  { nom: "Talents inemployés", m: null, quoi: "le temps d'expert passé sur de la saisie" },
  { nom: "Transport d'information", m: taches.length ? taches.filter(t => t.goulots.includes("switching") || t.goulots.includes("handoff")).reduce((s, t) => s + t.etapes.filter(e => ["input", "output"].includes(e.type)).length * t.duree_moyenne_min / (t.etapes.length || 1) * t.frequence_par_semaine, 0) : null, n: nGoulot("switching") + nGoulot("handoff") },
  { nom: "Stocks", m: null, quoi: "les dossiers en attente de traitement" },
  { nom: "Mouvements", m: null, txt: frises.length ? `${nf(frises.reduce((s, p) => s + (p.mesures?.bascules_par_heure || 0), 0) / frises.length, 1)} changements d'app / h` : null, quoi: "les changements d'application" },
  { nom: "Contrôles en trop", m: taches.length ? parSemaine(e => e.type === "check") : null },
];

/* Recommandations : chacune n'existe que si la mesure qui la justifie existe */
const candidats = [];
if (appsAgents.size >= 2) candidats.push({ type: "gens", titre: "Une seule méthode pour piloter les agents", texte: `${appsAgents.size} outillages d'agents coexistent (${[...appsAgents].join(", ")}). Écrire les consignes communes une fois, en « skills » partagées, et les brancher partout.` });
if (cible) candidats.push({ type: "tech", titre: `Automatiser « ${cible.titre.toLowerCase()} »`, texte: `${hmin(cible.heures * 60)} par semaine aujourd'hui, dont ${hmin(cible.heures * cible.gain * 60)} que l'IA peut reprendre. Générer l'agent depuis les étapes observées, puis remesurer une semaine.` });
if (medEcran) candidats.push({ type: "gens", titre: "Protéger les plongées", texte: `Un changement d'écran toutes les ${medEcran} s en médiane. Regrouper messages et veille sur des créneaux, et suivre chaque semaine la plus longue plongée (${Math.round(plongeeMax)} min aujourd'hui).` });
if (gains[1]) candidats.push({ type: "tech", titre: `Puis « ${gains[1].titre.toLowerCase()} »`, texte: `${hmin(gains[1].heures * 60)} par semaine${gains[1].postes.length > 1 ? `, chez ${gains[1].postes.length} postes` : ""}. Même méthode, une fois le premier agent en place.` });
if (horsListe && horsListe.length) candidats.push({ type: "gens", titre: "Fournir un outil d'IA officiel", texte: `${horsListe.length} outil${horsListe.length > 1 ? "s" : ""} d'IA utilisé${horsListe.length > 1 ? "s" : ""} hors de la liste fournie (${horsListe.join(", ")}). En choisir un, l'ouvrir à tous, et poser ses règles d'usage.` });
if (risques.some(r => r.crit.id === "sensibilite")) candidats.push({ type: "gens", titre: "Encadrer les données sensibles", texte: `${risques.filter(r => r.crit.id === "sensibilite").length} tâche(s) touchent des données clients ou de paiement. Écrire ce qui peut partir vers une IA, et ce qui ne le peut pas.` });
if (partIA != null && partIA < .1) candidats.push({ type: "gens", titre: "Former l'équipe à déléguer", texte: `L'IA ne pèse que ${pct(partIA)} du temps d'écran. Une formation courte, sur les tâches de ce rapport, avant de déployer quoi que ce soit.` });
const recos = candidats.slice(0, 3);
if (!recos.length) recos.push({ type: "gens", titre: "Élargir l'observation", texte: "Les mesures disponibles ne suffisent pas encore à justifier une action. Ajouter des postes et une semaine complète d'observation." });
const limites = [];
const sansFrise = postes.filter(p => !p.segments?.length).length;
if (sansFrise) limites.push(`${sansFrise} poste${sansFrise > 1 ? "s" : ""} sur ${postes.length} sans frise minute par minute (résumé validé seulement).`);
const nJours = (() => { const d = x => Date.parse(String(x || "").slice(0, 10)), a = d(A.periode.debut), b = d(A.periode.fin); return a && b ? Math.max(1, Math.round((b - a) / 864e5) + 1) : 1; })();
limites.push(nJours > 1 ? `${nJours} jours observés, une seule semaine.` : `Une fenêtre de ${hmin(D1 - D0)} observée, pas une semaine.`);
const postesTaches = new Set(taches.flatMap(t => t.postes)).size;
if (taches.length) limites.push(`Tâches décrites pour ${postesTaches} poste${postesTaches > 1 ? "s" : ""} sur ${postes.length}, extrapolées à la semaine.`); else limites.push("Aucune tâche répétée décrite pour l'instant.");
limites.push("La qualité du travail n'est pas mesurée, seulement le temps.");

/* Hypothèses testées, règles, capacités : des listes calculées, pas écrites à la main */
const hypotheses = [];
if (partIA != null) hypotheses.push({ h: "L'équipe se sert encore peu de l'IA", vrai: partIA < .2, preuve: `${pct(partIA)} du temps d'écran passe par un outil d'IA` });
if (partAgent != null) hypotheses.push({ h: "L'IA sert surtout à discuter avec un chatbot", vrai: partAgent < .5, preuve: `${pct(partAgent)} du temps d'IA passe par des agents qui agissent seuls` });
if (medEcran) hypotheses.push({ h: "On reste longtemps concentré sur un même écran", vrai: medEcran >= 120, preuve: `${medEcran} s par écran en médiane, plus longue plongée de ${Math.round(plongeeMax)} min` });
if (frises.length >= 2 && ensemble) hypotheses.push({ h: "Les postes travaillent ensemble sur les mêmes sujets", vrai: memeSujet / ensemble >= .25, preuve: `${hmin(memeSujet)} sur le même sujet, sur ${hmin(ensemble)} passées côte à côte` });
if (taches.length) { const d = taches.filter(t => t.dejaIA).reduce((s, t) => s + t.heures, 0); hypotheses.push({ h: "Les tâches répétées sont déjà outillées par l'IA", vrai: d / heuresTaches >= .5, preuve: `${hmin(d * 60)} sur ${hmin(heuresTaches * 60)} de tâches répétées se font déjà avec l'IA` }); }
const regles = [];
if (outilsIA.length) regles.push({ titre: "Tenir la liste des outils d'IA autorisés", constat: `${pluriel(outilsIA.length, "outil")} d'IA en usage (${outilsIA.join(", ")})${horsListe ? `, dont ${horsListe.length} hors de la liste fournie` : ", sans liste de référence connue"}.` });
if (risques.some(r => r.crit.id === "sensibilite")) regles.push({ titre: "Aucune donnée client ou de paiement vers une IA sans relecture", constat: `${pluriel(risques.filter(r => r.crit.id === "sensibilite").length, "tâche")} touchent ces données : ${risques.filter(r => r.crit.id === "sensibilite").map(r => `« ${r.t.titre} »`).slice(0, 2).join(", ")}.` });
if (partAgent != null && partAgent > .5) regles.push({ titre: "Relire chaque sortie d'agent avant qu'elle parte", constat: `${pct(partAgent)} du temps d'IA passe par des agents qui agissent seuls.` });
if (taches.some(t => t.nDec)) regles.push({ titre: "Garder la décision à un humain", constat: `${pluriel(taches.filter(t => t.nDec).length, "tâche")} comportent une étape de décision.` });
const nUtilIA = iaPostes.filter(x => (x.part || 0) > 0).length;
const capacites = [
  { nom: "Adoption", ok: true, txt: `${nUtilIA} postes sur ${postes.length} utilisent l'IA${partIA != null ? `, ${pct(partIA)} du temps d'écran` : ""}.` },
  { nom: "Technologie", ok: true, txt: outilsIA.length ? `${pluriel(outilsIA.length, "outil")} d'IA en usage : ${outilsIA.join(", ")}.` : "Aucun outil d'IA observé." },
  { nom: "Données partagées", ok: true, txt: `${pluriel(partages.length, "outil")} commun${partages.length > 1 ? "s" : ""} sur ${outilsListe.length}${partages.length ? ` (${partages.map(o => o.n).join(", ")})` : ""}.` },
  { nom: "Coordination", ok: frises.length >= 2, txt: frises.length >= 2 ? `${hmin(memeSujet)} sur le même sujet en parallèle, sur ${hmin(ensemble)} côte à côte.` : "Il faut au moins deux frises minute par minute." },
  { nom: "Talents", ok: false, txt: "Pas visible à l'écran : à évaluer en entretien." },
  { nom: "Modèle opérationnel", ok: false, txt: "Pas visible à l'écran : qui décide, qui exécute, à évaluer en entretien." },
];

/* ==========================================================================================
   Catalogue des métriques : id → { n (nombre), k (sorte : pct, min, heures, s, eur, n, txt), f (format), u, l, c }
   Les méthodes s'y réfèrent par {id} dans leurs textes. Une métrique absente devient « pas encore observé ».
   ========================================================================================== */
const MET = {};
const met = (id, o) => { if (o.n == null && o.v == null) return; if (o.n != null && !Number.isFinite(o.n)) return; o.k ||= "n"; if (!o.f) o.f = { pct: x => Math.round(x) + " %", min: hmin, heures: x => nf(Math.round(x)) + " h", s: x => Math.round(x) + " s", eur: x => nf(Math.round(x)) + " €" }[o.k] || nfa; if (o.v == null) o.v = o.f(o.n); MET[id] = o; return o; };
const txt = (id, v, l) => v ? met(id, { v, k: "txt", l }) : null;
met("temps_total", { n: totalEquipe || null, k: "min", l: "de travail à l'écran, tous postes" });
met("postes", { n: postes.length || null, u: "postes", l: "postes observés" });
met("postes_frise", { n: frises.length, u: "postes", l: "suivis minute par minute" });
met("periode", { v: nJours > 1 ? `${nJours} jours, ${hm(D0)} → ${hm(D1)}` : `${hm(D0)} → ${hm(D1)}`, k: "txt", l: "fenêtre observée" });
met("n_jours", { n: nJours, u: "jours", l: "jours observés" });
if (partIA != null) { met("part_ia", { n: partIA * 100, k: "pct", l: "du temps d'écran avec un outil d'IA", c: "ia" }); met("jours_actifs_ia", { n: partIA > 0 ? nJours : 0, u: "jours", l: "jours avec de l'IA" }); }
if (partAgent != null) { met("part_agent", { n: partAgent * 100, k: "pct", l: "du temps d'IA passe par des agents", c: "ia" }); met("part_chat", { n: (1 - partAgent) * 100, k: "pct", l: "du temps d'IA en conversation" }); }
const partsIA = iaPostes.filter(x => x.part != null);
if (partsIA.length >= 2) { const lo = Math.min(...partsIA.map(x => x.part)), hi = Math.max(...partsIA.map(x => x.part));
  met("ecart_ia", { n: Math.round((hi - lo) * 100), f: x => Math.round(x) + " pts", t: `de ${pct(lo)} à ${pct(hi)}`, l: `d'écart d'usage de l'IA entre postes (${pct(lo)} à ${pct(hi)})` }); }
met("n_utilisateurs_ia", { n: nUtilIA, u: "postes", l: "postes qui utilisent l'IA" });
const catTri = Object.entries(equipe).sort((a, b) => b[1] - a[1]);
if (catTri[0]) { txt("cat_1", CATS[catTri[0][0]], "premier poste de temps"); met("cat_1_min", { n: catTri[0][1], k: "min", l: `dans « ${CATS[catTri[0][0]]} »` }); met("cat_1_part", { n: catTri[0][1] / totalEquipe * 100, k: "pct", l: `du temps dans « ${CATS[catTri[0][0]]} »`, c: catTri[0][0] === "ia" ? "ia" : null });
  met("n_taches_branche", { n: taches.filter(t => catTri[0][0] === "ia" ? t.dejaIA : t.apps.some(a => categorieApp(a) === catTri[0][0])).length, u: "tâches", l: "tâches répétées dans cette branche" }); }
if (catTri[1]) { txt("cat_2", CATS[catTri[1][0]], "deuxième poste de temps"); met("cat_2_min", { n: catTri[1][1], k: "min", l: `dans « ${CATS[catTri[1][0]]} »` }); }
const partDe = cs => totalEquipe ? cs.reduce((s, c) => s + (equipe[c] || 0), 0) / totalEquipe * 100 : null;
met("part_coordination", { n: partDe(["reunion", "comm", "admin"]), k: "pct", l: "du temps en réunions, messages et administratif" });
met("part_complexite", { n: partDe(["reunion", "comm", "admin"]), k: "pct", l: "du temps en coordination interne" });
const denomCoeur = ["projet", "reunion", "comm", "admin"].reduce((s, c) => s + (equipe[c] || 0), 0);
if (denomCoeur) met("part_coeur", { n: (equipe.projet || 0) / denomCoeur * 100, k: "pct", l: "du temps de travail sur le cœur du métier" });
if (frises.length) {
  met("ecran_median_s", { n: medEcran, k: "s", l: "par écran, en médiane, avant de changer" });
  const bph = frises.reduce((s, p) => s + (p.mesures?.bascules_par_heure || 0), 0) / frises.length;
  met("bascules_heure", { n: bph, f: x => nf(x, 1), u: "par heure", t: `${nf(bph, 1)} changements d'application par heure en moyenne`, l: "changements d'application par heure" });
  met("plongee_max", { n: plongeeMax, k: "min", l: "la plus longue plongée sans décrocher" });
  if (plongeur) txt("plongee_heure", hm(plongeur.mesures.plongee.debut), "début de la plus longue plongée");
  txt("creneau_max", creneauMax, "créneau le plus haché");
  met("minutes_ensemble", { n: ensemble, k: "min", l: "à l'écran en même temps" });
  met("meme_sujet_min", { n: memeSujet, k: "min", l: "sur le même sujet en même temps" });
}
met("outils", { n: outilsListe.length, u: "outils", l: "outils utilisés plus de 3 min" });
met("outils_partages", { n: partages.length, u: "outils", l: "outils partagés par plusieurs postes" });
met("seuil_postes", { n: 2, l: "postes au moins" });
met("outils_ia", { n: outilsIA.length, u: "outils", l: `outils d'IA en usage${outilsIA.length ? ` (${outilsIA.join(", ")})` : ""}`, c: "ia" });
if (horsListe) met("n_hors_liste", { n: horsListe.length, u: "outils", l: "outils d'IA hors de la liste fournie" });
txt("outil_1", (partages[0] || outilsListe[0])?.n, "outil central");
if (paireTop) { const [a, b] = paireTop[0].split("→"); txt("app_a", a); txt("app_b", b); met("n_paire", { n: paireTop[1], l: "passages entre ces deux apps" }); }
const COUT = PARAM.cout_horaire || null;
if (COUT) met("cout_horaire", { n: COUT, k: "eur", l: "coût horaire chargé (onboarding)" });
if (taches.length) {
  met("taches", { n: taches.length, u: "tâches", l: "tâches répétées décrites" });
  met("heures_taches", { n: heuresTaches * 60, k: "min", u: "par semaine", l: "de tâches répétées par semaine" });
  met("heures_automatisables", { n: heuresAuto * 60, k: "min", u: "par semaine", l: "par semaine que l'IA peut reprendre", c: "ia" });
  met("heures_restantes", { n: (heuresTaches - heuresAuto) * 60, k: "min", u: "par semaine", l: "par semaine qui restent humaines" });
  met("heures_an", { n: heuresAuto * 47, k: "heures", u: "par an", l: "rendues sur une année de 47 semaines", c: "ia" });
  met("jours_an", { n: heuresAuto * 47 / 7, u: "jours", l: "de travail de 7 h rendus par an", c: "ia" });
  met("taches_cibles", { n: gains.length, u: "tâches", l: "tâches que l'IA peut reprendre en partie" });
  met("gains_rapides", { n: taches.filter(t => quadrant(t) === "rapides").length, u: "tâches", l: "tâches en « gains rapides »" });
  met("n_a_lancer", { n: taches.filter(t => quadrant(t) === "rapides" && !t.dejaIA).length, u: "tâches", l: "tâches « à lancer »" });
  met("n_a_laisser", { n: taches.filter(t => quadrant(t) === "pieges").length, u: "tâches", l: "tâches « à laisser »" });
  met("taches_deja_ia", { n: taches.filter(t => t.dejaIA).length, u: "tâches", l: "tâches déjà faites avec l'IA", c: "ia" });
  met("n_taches_ia", { n: taches.filter(t => t.dejaIA).length, u: "tâches", l: "tâches où l'IA intervient", c: "ia" });
  const avecIA = taches.filter(t => t.dejaIA); if (avecIA.length) met("part_taches_verifiees", { n: avecIA.filter(t => t.nChk).length / avecIA.length * 100, k: "pct", l: "des tâches avec IA ont une vérification humaine" });
  met("taches_sensibles", { n: notes.filter(x => x.n[3][0] >= 2).length, u: "tâches", l: "tâches qui touchent des données sensibles" });
  txt("tache_1", taches[0].titre, "tâche n°1 en heures par semaine");
  met("tache_1_heures", { n: taches[0].heures * 60, k: "min", u: "par semaine", l: `pour « ${taches[0].titre} »` });
  let cum = 0, k = 0; while (k < taches.length && cum / heuresTaches < .8) cum += taches[k++].heures;
  met("n_top", { n: k, u: "tâches", l: `tâches font ${pct(cum / heuresTaches)} du temps répété` }); met("part_cumulee", { n: cum / heuresTaches * 100, k: "pct", l: `du temps répété dans les ${k} premières tâches` }); met("part_top", { n: cum / heuresTaches * 100, k: "pct", l: "du temps répété" });
  met("h_actuel", { n: heuresTaches * 60, k: "min", l: "par semaine aujourd'hui" }); met("h_cible", { n: (heuresTaches - heuresAuto) * 60, k: "min", l: "par semaine après automatisation" });
  gains.slice(0, 3).forEach((t, i) => met(`h_gain_${i + 1}`, { n: t.heures * t.gain * 60, k: "min", l: `repris sur « ${t.titre} »` }));
  txt("hypothese_gain", `${pct(TAUX)} de la durée des étapes de saisie, d'action et de sortie`, "taux de gain supposé");
  const nv = { deployer: taches.filter(t => t.cle === "peut"), refondre: taches.filter(t => t.cle === "aide"), inventer: taches.filter(t => t.cle === "flou") };
  met("h_deployer", { n: nv.deployer.reduce((s, t) => s + t.heures * t.gain, 0) * 60, k: "min", l: "par semaine à déployer" });
  met("h_refondre", { n: nv.refondre.reduce((s, t) => s + t.heures, 0) * 60, k: "min", l: "par semaine à refondre" });
  met("n_refondre", { n: nv.refondre.length, u: "processus", l: "processus à refondre" }); met("n_inventer", { n: nv.inventer.length, u: "pistes", l: "pistes à inventer" });
  const go = taches.filter(t => t.heures >= seuilV && t.confiance >= SEUIL_F), att = taches.filter(t => t.confiance < SEUIL_F);
  met("n_go", { n: go.length, u: "tâches", l: "tâches en zone « aller »" }); met("n_attendre", { n: att.length, u: "tâches", l: "tâches qui attendent un contrôle" }); txt("tache_bloquee", att[0]?.titre, "tâche bloquée");
  met("n_prioritaires", { n: taches.filter(t => quadrant(t) === "rapides").length, u: "tâches", l: "tâches importantes et bousculées" });

        if (!pp.segments.length) { x.strokeStyle = css("--trait-fort"); x.setLineDash([4, 4]); x.strokeRect(g, y + 6, w - g - 28, hl - 18); x.setLineDash([]); x.fillStyle = css("--faible"); x.fillText("résumé validé · pas de frise minute par minute", g + 10, y + hl / 2 + 2); return; }
        pp.segments.forEach(s => { if (s[0] > lim) return; x.fillStyle = coul(s[2]); x.fillRect(X(s[0]), y + 6, Math.max(1, X(Math.min(s[1], lim)) - X(s[0]) - .4), hl - 18); }); });

    };
    return { entrer() { p = 0; tween(2.2, v => { p = v; dessiner(); }, "power2.inOut"); }, redessiner() { p = 1; dessiner(); } };
  } };
};

VIZ["reseau"] = (ch, v) => {

  init(el) {
    const c = el.querySelector("canvas"); let p = 1;
    const L = outilsListe.slice(0, 14);
    const dessiner = () => { const { x, w, h } = toile(c);
      const P = postes.map((pp, i) => ({ id: pp.id, qui: pp.qui, x: Math.max(110, w * .16), y: h * (postes.length > 4 ? .08 + i * .84 / (postes.length - 1) : .22 + i * .56 / Math.max(1, postes.length - 1)) }));

      O.forEach(o => Object.entries(o.v).forEach(([pid, m]) => { const a = P.find(q => q.id === pid); if (!a) return; const commun = o.postes >= 2;

        x.beginPath(); x.moveTo(a.x + 8, a.y); x.bezierCurveTo((a.x + o.x) / 2, a.y, (a.x + o.x) / 2, o.y, o.x - 8, o.y); x.stroke(); x.globalAlpha = 1; }));
      P.forEach(a => { x.fillStyle = css("--encre"); x.fillRect(a.x - 7, a.y - 7, 14, 14); x.font = "500 13px Geist, sans-serif"; x.textAlign = "right"; x.fillText(a.id, a.x - 16, a.y - 2); x.fillStyle = css("--doux"); x.font = "10px Geist Mono, monospace"; x.fillText(a.qui, a.x - 16, a.y + 12); x.textAlign = "start"; });

    return { entrer() { p = 0; tween(1.4, v => { p = v; dessiner(); }); }, redessiner() { p = 1; dessiner(); } };
  } };

/* Anneau : temps par catégorie ; variantes agents / conversation, rendement du flux (PCE) */
VIZ["anneau"] = (ch, v) => {
  let parts, centre, label, defaut = "cat_1_part", legende = "";
  if (v === "agent") { if (!(agentT + chatT)) return vide("Aucun usage d'IA ventilé.", "le temps passé dans des agents (Orca, Claude Code…) et dans des conversations (ChatGPT, Claude…).");
    parts = [{ nom: "Agents qui agissent seuls", m: agentT, c: css("--ia") }, { nom: "Conversation", m: chatT, c: css("--ia-pale") }, { nom: "Sans IA", m: Math.max(0, totalEquipe - agentT - chatT), c: css("--trait") }].filter(p => p.m > 0);
    centre = partAgent; label = "délégué à des agents"; defaut = "part_agent"; }
  else if (v === "pce") { if (!vsm) return vide("Pas de flux à mesurer.", "une tâche décrite avec ses étapes et sa durée.");
    const s = k => vsm.etapes.filter(e => e.classe === k).reduce((a, e) => a + e.d, 0);
    parts = [{ nom: "Valeur ajoutée", m: s("valeur"), c: css("--encre") }, { nom: "Nécessaire sans valeur", m: s("necessaire"), c: css("--trait-fort") }, { nom: "Gaspillage", m: s("gaspillage"), c: css("--perte") }].filter(p => p.m);
    centre = vsm.pce; label = "rendement du flux"; defaut = "pce"; }
  else { if (!totalEquipe) return vide("Aucun temps mesuré.", "au moins un poste avec une frise ou un résumé validé.");
    parts = ORDRE.filter(c => equipe[c]).map(c => ({ nom: CATS[c], m: equipe[c], c: coul(c), ia: c === "ia" })); centre = partIA; label = "avec l'IA"; }
  const tot = parts.reduce((s, p) => s + p.m, 0);
  return { defaut, legende, html: `<div class="viz"><div class="pad"><div class="anneau">
      <div class="rond"><svg viewBox="0 0 200 200" aria-label="Répartition en anneau"></svg><div class="centre"><b style="${v === "pce" ? "color:var(--encre)" : ""}">${centre != null ? pct(centre) : "n.d."}</b><span>${label}</span></div></div>
      <div class="liste">${parts.map(x => `<div><i style="background:${x.c}"></i><span>${esc(x.nom)}</span><em>${v === "pce" ? nf(x.m, 1) + " min" : hmin(x.m)}</em><strong>${pct(x.m / tot)}</strong></div>`).join("")}</div>
    </div>${v === "pce" ? `<div class="mono" style="margin-top:14px;text-transform:none;letter-spacing:.02em">${esc(vsm.t.titre)} · durée répartie à parts égales entre les étapes</div>` : ""}</div></div>`,
  init(el) {
    const svg = el.querySelector("svg"), R = 78, C = 2 * Math.PI * R, ecart = parts.length > 1 ? 1.6 : 0;
    S(svg, "circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: css("--plan-2"), "stroke-width": 26 });
    let deb = 0;
    const arcs = parts.map(x => { const len = x.m / tot * C; const a = S(svg, "circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: x.c, "stroke-width": x.ia || x.c === css("--ia") ? 30 : 24, transform: "rotate(-90 100 100)", "stroke-dashoffset": -deb, "stroke-dasharray": `0 ${C}` }); const o = { a, len: Math.max(.5, len - ecart) }; deb += len; return o; });
    const lignes = [...el.querySelectorAll(".liste > div")], cb = el.querySelector(".centre b");
    return { entrer() {
      arcs.forEach(o => o.a.setAttribute("stroke-dasharray", `0 ${C}`));
      if (G && !reduit) { let t = 0; arcs.forEach(o => { const d = .25 + 1.1 * o.len / C, s = { v: 0 }; G.to(s, { v: 1, duration: d, delay: t, ease: "power1.inOut", onUpdate: () => o.a.setAttribute("stroke-dasharray", `${o.len * s.v} ${C}`) }); t += d; });
        apparaitre(lignes, { y: 0, x: 10, d: .5, s: .08 });
        const n = { v: 0 }; if (centre != null) G.to(n, { v: centre, duration: 1.4, ease: "power2.out", onUpdate: () => cb.textContent = pct(n.v) }); }
      else arcs.forEach(o => o.a.setAttribute("stroke-dasharray", `${o.len} ${C}`)); } };
  } };
};

VIZ["course"] = () => {
  if (!cible) return vide("Aucune tâche à rejouer.", "une tâche décrite dont des étapes de saisie, d'action ou de sortie peuvent passer à l'IA.");
  return { defaut: "cible_gain", legende: `<span><i style="background:var(--perte)"></i>Saisie et allers-retours</span><span><i style="background:var(--projet)"></i>Jugement humain</span><span><i style="background:var(--ia)"></i>Pris en charge par l'IA</span>`,
  extra: `<button type="button" class="bouton plein" data-r="rejouer">Rejouer la course</button>`,
  html: `<div class="viz"><div class="pad"><div class="course"></div></div></div>`,
  init(el) {
    const box = el.querySelector(".course"), n = cible.etapes.length, dur = cible.duree_moyenne_min;
    const etapes = cible.etapes.map(e => { const auto = AUTO.includes(e.type); return { ...e, auto, avant: dur / n, apres: auto ? dur / n * (1 - TAUX) : dur / n }; });
    const piste = (nom, cle) => `<div class="piste"><div class="tete"><b>${nom}</b><span class="chrono" data-c="${cle}">0:00</span></div><div class="rangee">${etapes.map(e => `<div style="flex:${e.avant}"><i data-c="${cle}" data-f="${e[cle] / e.avant}" style="background:var(${cle === "apres" && e.auto ? "--ia" : (e.auto && cle === "avant" ? "--perte" : "--projet")})"></i><span>${esc(e.texte)}</span></div>`).join("")}</div></div>`;
    box.innerHTML = `<div class="mono">${esc(cible.titre)} · ${nfa(cible.frequence_par_semaine)} fois par semaine · hypothèse : ${pct(TAUX)} des étapes automatisables</div>` + piste("Aujourd'hui", "avant") + piste("Avec l'IA", "apres");
    const jouer = () => {
      const segs = { avant: [...box.querySelectorAll('i[data-c="avant"]')], apres: [...box.querySelectorAll('i[data-c="apres"]')] };
      Object.values(segs).flat().forEach(i => i.style.width = "0%");
      ["avant", "apres"].forEach(cle => { const chrono = box.querySelector(`.chrono[data-c="${cle}"]`), total = etapes.reduce((s, e) => s + e[cle], 0);
        if (!G || reduit) { segs[cle].forEach(i => i.style.width = i.dataset.f * 100 + "%"); chrono.textContent = nf(total, 1) + " min"; return; }
        const tl = G.timeline(); let t = 0, k = 0;
        segs[cle].forEach(i => { const d = Math.max(.05, etapes[k++][cle] * Math.min(.5, 6 / dur)); tl.to(i, { width: i.dataset.f * 100 + "%", duration: d, ease: "none" }, t); t += d; });
        const o = { v: 0 }; G.to(o, { v: total, duration: t, ease: "none", onUpdate: () => chrono.textContent = nf(o.v, 1) + " min" }); });
    };
    el.querySelector('[data-r="rejouer"]')?.addEventListener("click", jouer);
    return { entrer: jouer };
  } };
};

  const add = id => { if (id && MET[id] && MET[id].n != null && !ids.includes(id)) ids.push(id); };
  const surFlux = /\{heures\}/.test(ch.lecture || ""), REF = r => surFlux && r === "calc:heures_semaine_tache" ? "heures" : surFlux && r === "calc:cout_tache" ? "euros" : REFS[r];
  const refs = ch.metriques || []; [...refs.filter(r => r.startsWith("calc:")), ...refs.filter(r => !r.startsWith("calc:"))].forEach(r => add(MET[r] ? r : REF(r)));
  if (ch.viz === "chiffre-cle") [...String(ch.lecture || "").matchAll(/\{([a-z0-9_]+)\}/g)].forEach(m => { const id = ALIAS[m[1]] || m[1]; if (!(m[1] in ctx)) add(id); });
  return ids; };

/* ==========================================================================================
   Chapitres : construits depuis la spec de la méthode
   ========================================================================================== */
const ICONES = {
  pyramide: `<path d="M11 3 L20 19 H2 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 12 H15.5" stroke="currentColor" stroke-width="1.2"/>`,
  matrice: `<rect x="3" y="3" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="3" width="7" height="7" fill="var(--ia)" stroke="var(--ia)" stroke-width="1.5"/><rect x="3" y="12" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="12" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/>`,
  flux: `<path d="M2 11 H16 M12 6 L17 11 L12 16" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="5" width="4" height="12" fill="none" stroke="currentColor" stroke-width="1.2"/>`,
  confiance: `<path d="M11 2.5 L18.5 5.5 V11 C18.5 15.5 15 18.5 11 19.5 C7 18.5 3.5 15.5 3.5 11 V5.5 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 11 L10 13.5 L14.5 8.5" fill="none" stroke="var(--ia)" stroke-width="1.6"/>`,
  resultats: `<path d="M3 19 V13 M8.5 19 V9 M14 19 V6 M19.5 19 V3" stroke="currentColor" stroke-width="2.2"/>`,
};
ICONES.frontiere = ICONES.matrice; ICONES.gemba = ICONES.flux; ICONES.gardefou = ICONES.confiance; ICONES.resultat = ICONES.resultats;
document.getElementById("marque").innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="color:var(--encre)">${ICONES[M.id] || `<rect x="6" y="6" width="10" height="10" transform="rotate(45 11 11)" fill="none" stroke="currentColor" stroke-width="1.5"/>`}</svg>
  <div><div class="nom">Méthode ${esc(M.nom)}${PARAM.entreprise ? ` · ${esc(PARAM.entreprise)}` : ""}</div><div class="insp">inspirée de ${esc(String(M.inspire_de || "").replace(/\s*\(.*\)\s*$/, ""))}</div></div>`;
document.getElementById("methodes").innerHTML = METHODES.map(m => `<a href="?methode=${encodeURIComponent(m.id)}" class="${m.id === M.id ? "actif" : ""}"${m.id === M.id ? ' aria-current="page"' : ""}>${esc(m.nom)}</a>`).join("");

const lectureHtml = (ch, k, r, ctx, ids) => {
  const manq = new Set();
  const direct = (ch.metriques || []).some(x => MET[x]), defautOk = MET[r.defaut] && MET[r.defaut].n != null;
  const principal = r.sansChiffre ? null : ids.includes(r.defaut) ? r.defaut : !direct && defautOk ? r.defaut : (ids[0] || (defautOk ? r.defaut : null));
  const autres = r.sansChiffre ? [] : ids.filter(id => id !== principal).slice(0, 2);
  const m = principal && MET[principal], court = x => x.t && x.t.length < 18;
  const titre = remplir(ch.titre, ctx, manq), question = remplir(ch.question, ctx, manq), corps = remplir(ch.lecture, ctx, manq);
  return `<div class="lecture"><div><div class="numero"><span>${String(k + 1).padStart(2, "0")}</span><em>${question}</em></div><h2>${titre}</h2></div>
    <div style="display:grid;gap:14px">
      ${m ? `<div class="chiffre${m.c === "ia" ? " ia" : m.c === "perte" ? " perte" : ""}" data-met="${principal}"><span class="val">${esc(court(m) ? m.t : m.v)}</span>${uniteVisible(m) && !court(m) ? `<small>${esc(m.u)}</small>` : ""}</div><div class="chiffre-l">${esc(m.l)}</div>` : ""}
      ${corps ? `<p>${corps}</p>` : ""}
      ${autres.length ? `<div class="kpis">${autres.map(id => { const x = MET[id]; return `<div class="kpi"><b class="${x.c === "ia" ? "ia" : ""}">${esc(court(x) ? x.t : x.v + (x.u ? " " + x.u : ""))}</b><span>${esc(x.l)}</span></div>`; }).join("")}</div>` : ""}
      ${noteManque(manq)}
      ${r.extra || ""}
    </div></div>`;
};

const chapitres = (M.chapitres || []).map((ch, k) => {
  const v = variante(ch), ctx = contexte(ch, v), ids = metriquesDe(ch, ctx);
  let r;
  try {
    if (v === "nps") r = vide("Le score de recommandation des équipes n'est pas encore mesuré.", "une question de 0 à 10 posée dans la page de relecture (« recommanderiez-vous cet agent à un collègue ? »). L'écran ne la voit pas.");
    else if (v === "indice") r = vide("L'indice de confiance par pilier ne se lit pas à l'écran.", "une notation de 1 à 5 par pilier (gouvernance, sécurité, données, équité), en entretien. L'écran ne voit que l'usage.", ["outils_ia", "taches_sensibles"]);
    else r = (VIZ[ch.viz] || (() => vide(`Visualisation « ${esc(ch.viz)} » pas encore disponible.`, "un moteur de rendu pour ce type d'écran.")))(ch, v, ids);
  } catch (e) { console.warn(e); r = vide("Ce chapitre n'a pas pu être calculé.", "des données d'audit complètes pour ce chapitre."); }
  return { ch, r, nom: String(ch.question || ch.id).replace(/\{[^}]+\}/g, ""), html: () => r.html + lectureHtml(ch, k, r, ctx, ch.viz === "chiffre-cle" ? [] : ids) };
});

/* ---------- Mécanique de story ---------- */
const story = document.getElementById("story"), prog = document.getElementById("progres"), legende = document.getElementById("legende");
chapitres.forEach((c, k) => { const s = document.createElement("section"); s.className = "chap"; s.setAttribute("aria-label", c.nom); s.innerHTML = c.html(); story.appendChild(s); c.el = s;
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Chapitre ${k + 1}`); b.innerHTML = "<span><b></b></span>"; b.addEventListener("click", () => aller(k)); prog.appendChild(b); });
let i = -1, auto = !reduit && !/[?&]pause\b/.test(location.search), minuteur = null;
const DUREE = 11;
function aller(k) {
  if (!chapitres.length) return;
  k = (k + chapitres.length) % chapitres.length;
  if (i >= 0) { chapitres[i].el.classList.remove("actif"); chapitres[i].api?.sortir?.(); }
  i = k; const c = chapitres[i];
  c.el.classList.add("actif");
  if (!c.api) { try { c.api = c.r.init(c.el) || {}; } catch (e) { console.warn(e); c.api = {}; } }
  try { c.api.entrer?.(); } catch (e) { console.warn(e); }
  legende.innerHTML = c.r.legende || "";
  compter(c.el.querySelector(".lecture"));
  [...prog.querySelectorAll("b")].forEach((b, j) => { if (G) G.killTweensOf(b); b.style.width = j < i ? "100%" : "0%"; });
  const barre = prog.querySelectorAll("b")[i];
  apparaitre(c.el.querySelectorAll(".lecture > *"), { s: .08 });
  clearTimeout(minuteur);
  if (auto && G) { G.fromTo(barre, { width: "0%" }, { width: "100%", duration: DUREE, ease: "none" }); minuteur = setTimeout(() => aller(i + 1), DUREE * 1000); }
  else barre.style.width = "100%";
  try { history.replaceState(null, "", location.search + "#c" + (i + 1)); } catch (e) {}
}
document.getElementById("suiv").addEventListener("click", () => aller(i + 1));
document.getElementById("prec").addEventListener("click", () => aller(i - 1));
const bAuto = document.getElementById("auto");
bAuto.textContent = auto ? "Pause" : "Lecture";
bAuto.addEventListener("click", () => { auto = !auto; bAuto.textContent = auto ? "Pause" : "Lecture"; aller(i); });
addEventListener("keydown", e => { if (e.target.closest("canvas")) return; if (e.key === "ArrowRight") aller(i + 1); if (e.key === "ArrowLeft") aller(i - 1); if (e.key === " ") { e.preventDefault(); bAuto.click(); } });
let attente = null;
addEventListener("resize", () => { clearTimeout(attente); attente = setTimeout(() => chapitres[i]?.api?.redessiner?.(), 120); });
const depart = Math.max(0, (parseInt((location.hash.match(/^#c(\d+)$/) || [])[1]) || 1) - 1);
(document.fonts?.ready || Promise.resolve()).then(() => aller(Math.min(depart, chapitres.length - 1)));
</script>
